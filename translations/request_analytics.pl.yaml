'No statistics yet. Insights need %days% complete days of them and then appear here on their own.': 'Brak jeszcze statystyk. Wnioski wymagają %days% pełnych dni statystyk, a potem pojawią się tu same.'
'Insights need %days% complete days of statistics (so far: %count%). The first ones can appear on %day%.': 'Wnioski wymagają %days% pełnych dni statystyk (dotąd: %count%). Pierwsze mogą się pojawić %day%.'
'Too few visits to tell a real problem from chance (last %days% days: %count%). Insights appear as the site gets more visits.': 'Za mało odwiedzin, by odróżnić prawdziwy problem od przypadku (ostatnie %days% dni: %count%). Wnioski pojawią się, gdy witryna będzie mieć więcej odwiedzin.'
