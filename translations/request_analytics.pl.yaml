# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% zawiera link do %path%, która nie istnieje (żądania: %count%).'
'Fix or remove the link on that page.': 'Popraw lub usuń link na tej stronie.'
'Probably %target% was meant: fix the link on that page.': 'Prawdopodobnie chodziło o %target%: popraw link na tej stronie.'
'%path% does not exist, and gets %count% requests from %host%.': 'Strona %path% nie istnieje, a trafiają na nią żądania z witryny %host% (żądania: %count%).'
'%path% does not exist, and gets %count% requests from other sites.': 'Strona %path% nie istnieje, a trafiają na nią żądania z innych witryn (żądania: %count%).'
'Redirect it to the page that replaced it.': 'Przekieruj ją na stronę, która ją zastąpiła.'
'Redirect it to %target%.': 'Przekieruj ją na %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Wizyty w przeglądarce %subject% otwierają mniej więcej od %day% tylko %after% strony na wizytę zamiast %before%. W innych przeglądarkach nic się nie zmieniło.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Wizyty na urządzeniu %subject% otwierają mniej więcej od %day% tylko %after% strony na wizytę zamiast %before%. Na innych urządzeniach nic się nie zmieniło.'
'Test the site in %subject%, especially what was deployed around that day.': 'Przetestuj witrynę w przeglądarce %subject%, zwłaszcza to, co wdrożono w okolicach tego dnia.'
'Test the site on %subject%, especially what was deployed around that day.': 'Przetestuj witrynę na urządzeniu %subject%, zwłaszcza to, co wdrożono w okolicach tego dnia.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': 'Dnia %day% Bolt nie zarejestrował żadnej odsłony, ale boty przyszły: prawdopodobnie odpowiada cache lub CDN bez udziału Bolta albo zbieranie danych jest wyłączone.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Sprawdź, czy żądania stron docierają do Bolta i czy rozszerzenie jest włączone.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': 'Dnia %day% nie było żadnych żądań: witryna była prawdopodobnie niedostępna albo agregacja się nie uruchomiła.'
'Check the server log of that day, and that the rollup runs.': 'Sprawdź log serwera z tego dnia oraz to, czy agregacja działa.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': '%host% jest liczony jako odesłanie (wizyty: %count%): przejścia między stronami tej witryny są prawdopodobnie liczone jako nowe wizyty.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Dodaj %hosts% do %setting% w konfiguracji Request Analytics.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': '%share% wizyt przychodzi bez referera, a wizyta otwiera tylko %per_visit% strony: prawdopodobnie kliknięcia między stronami też go nie mają, więc każde liczy się jako nowa wizyta.'
'Send the header %header%.': 'Wysyłaj nagłówek %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': 'Wizyty z przeglądarek, które na pierwszym miejscu proszą o język %language%: %count% (%share%). Witryna nie ma stron w tym języku, a te wizyty otwierają %per_visit% strony na wizytę wobec %others% u pozostałych.'
'Translate the pages most visits start on first.': 'Najpierw przetłumacz strony, na których zaczyna się najwięcej wizyt.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Najpierw przetłumacz strony, na których zaczyna się najwięcej wizyt: %pages% (zaczyna się na nich %pages_share% wizyt).'
'%count% searches for %term%, and no page is about it.': 'Wyszukiwania frazy %term%: %count%, a żadna strona jej nie dotyczy.'
'Write one, or add the word to a page that answers it.': 'Napisz taką stronę albo dodaj to słowo do strony, która odpowiada na to pytanie.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': 'Wyszukiwania frazy %term%: %count%, choć strona %page% istnieje: prawdopodobnie trudno ją znaleźć.'
'Link it from the menu or the homepage.': 'Dodaj do niej link w menu lub na stronie głównej.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': '%visit_share% wizyt preferuje język: %language%, więcej niż język: %default%, ale domyślnym językiem witryny jest %default% i pozostaje w nim %default_share% odsłon.'
'Make %language% the default language, or offer it on the homepage.': 'Ustaw jako domyślny język: %language% albo zaproponuj go na stronie głównej.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': '%visit_share% wizyt preferuje język: %language%, ale w tym języku jest tylko %view_share% odsłon.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Wizyty prawdopodobnie nie znajdują przełącznika języków: umieść go w nagłówku, z nazwą języka, a nie tylko flagą.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'Wizyty znajdują przełącznik języków, ale trafiają na niewłaściwy język: dodaj linki hreflang, umieść tłumaczenia w mapie witryny i zaproponuj język %language% na stronach wejściowych (jako propozycję, nigdy wymuszone przekierowanie).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'Wizyty znajdują przełącznik języków, ale trafiają na niewłaściwy język: dodaj linki hreflang, umieść tłumaczenia w mapie witryny i zaproponuj język %language% na stronach, na których najczęściej go zmieniają: %pages% (jako propozycję, nigdy wymuszone przekierowanie).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: odsłony w ciągu 90 dni: %count% (%share%), a ten język preferuje %visit_share% wizyt.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Utrzymywanie go w aktualności może się nie opłacać: tłumacz tylko kluczowe strony, przestań tłumaczyć nowe treści albo usuń ten język.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% razem: odsłony w ciągu 90 dni: %count% (%share%), a jeden z tych języków preferuje %visit_share% wizyt.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Utrzymywanie ich w aktualności może się nie opłacać: tłumacz tylko kluczowe strony, przestań tłumaczyć nowe treści albo usuń niektóre języki.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Wizyty: %change% (%before% → %after%). Kanał %channel% odpowiada za %share% spadku. Wizyty otwierają też mniej stron.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Wizyty: %change% (%before% → %after%). Kanał %channel% odpowiada za %share% spadku.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Wizyty: %change% (%before% → %after%). Kanał %channel% odpowiada za %share% spadku, głównie %pages%. Wizyty otwierają też mniej stron.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Wizyty: %change% (%before% → %after%). Kanał %channel% odpowiada za %share% spadku, głównie %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Sprawdź pozycje tych stron w wyszukiwarce oraz czy nie zmienił się ich tytuł lub adres.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Prawdopodobnie zakończył się cykliczny post lub kampania: sprawdź, co było tam wcześniej publikowane.'
'Probably a linking site removed its link.': 'Prawdopodobnie jakaś witryna usunęła link.'
'Probably %source% removed its link: check the linking page.': 'Prawdopodobnie witryna %source% usunęła link: sprawdź stronę, która linkowała.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Sprawdź zakładki i drukowane linki (plakaty, kody QR), które prowadzą do tych stron.'
