'Nothing needs attention. Broken links, site search, languages, visits and browsers of the last %days% days look fine.': 'Nic nie wymaga uwagi. Niedziałające linki, wyszukiwanie w witrynie, języki, odwiedziny i przeglądarki z ostatnich %days% dni są w porządku.'

# Deleting statistics (administrators and developers)
'Manage statistics': 'Zarządzanie statystykami'
'Delete statistics': 'Usuń statystyki'
'Delete the statistics of the last days, or all of them. Deleted statistics cannot be recovered.': 'Usuwa statystyki z ostatnich dni lub wszystkie. Usuniętych statystyk nie można odzyskać.'
'Delete statistics…': 'Usuń statystyki…'
'Close': 'Zamknij'
'Which statistics should be deleted? The period always ends now; older statistics stay as they are.': 'Które statystyki usunąć? Okres zawsze kończy się teraz; starsze statystyki pozostają bez zmian.'
'Period to delete': 'Okres do usunięcia'
'Today': 'Dzisiaj'
'Last 90 days': 'Ostatnie 90 dni'
'Number of days': 'Liczba dni'
'Everything': 'Wszystko'
'All statistics ever collected': 'Wszystkie zebrane statystyki'
'From %date%': 'Od %date%'
'Cancel': 'Anuluj'
'Continue': 'Dalej'
'Delete permanently?': 'Usunąć trwale?'
'The statistics from %date% to now will be deleted:': 'Statystyki od %date% do teraz zostaną usunięte:'
'All statistics will be deleted:': 'Wszystkie statystyki zostaną usunięte:'
'All statistics, collected since %date%, will be deleted:': 'Wszystkie statystyki, zbierane od %date%, zostaną usunięte:'
'And everything else of these days: pages, sources, devices, languages, site searches, broken links and bots.': 'I wszystko inne z tych dni: strony, źródła, urządzenia, języki, wyszukiwania w witrynie, niedziałające linki i boty.'
'This cannot be undone. The statistics are erased for good; only a backup of the database can bring them back.': 'Tej operacji nie można cofnąć. Statystyki zostaną usunięte na zawsze; przywrócić je może tylko kopia zapasowa bazy danych.'
'I understand that the deleted statistics cannot be recovered.': 'Rozumiem, że usuniętych statystyk nie można odzyskać.'
'Delete permanently': 'Usuń trwale'
'The statistics could not be counted.': 'Nie udało się policzyć statystyk.'
'The statistics could not be deleted.': 'Nie udało się usunąć statystyk.'
'All statistics were deleted.': 'Wszystkie statystyki zostały usunięte.'
'The statistics of the chosen period were deleted.': 'Statystyki z wybranego okresu zostały usunięte.'
'The statistics are being aggregated right now. Try again in a minute.': 'Statystyki są właśnie agregowane. Spróbuj ponownie za minutę.'
