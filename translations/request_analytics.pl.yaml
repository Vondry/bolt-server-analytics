'A request is a bot when its User-Agent names one, or when its headers contradict the browser it claims to be. Bots are not counted in page views, visits or any other card. AI crawlers collect pages for AI models and answer engines; robots.txt can ask them to stay away.': 'Żądanie jest botem, gdy jego User-Agent go wskazuje albo gdy nagłówki przeczą przeglądarce, za którą się podaje. Boty nie są liczone w wyświetleniach, wizytach ani w żadnej innej karcie. Crawlery AI zbierają strony dla modeli AI i wyszukiwarek odpowiedzi; robots.txt może poprosić je, by trzymały się z daleka.'
'Where visitors came from and went next': 'Skąd przyszli odwiedzający i dokąd poszli dalej'
