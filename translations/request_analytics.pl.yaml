'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'W tej kolejności: parametry UTM linku, identyfikator kliknięcia dodany przez sieć reklamową (gclid, fbclid, …), strona, z której przyszedł odwiedzający.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Bezpośrednio: wpisany adres, zakładka lub aplikacja, która nic nie zdradza. Nieznane: brak jakiejkolwiek wskazówki.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Dodaj parametry UTM do publikowanych linków: utm_campaign nazywa kampanię, utm_source miejsce, utm_medium rodzaj kanału.'
'Newsletter': 'Newsletter'
'Social media post': 'Post w mediach społecznościowych'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: automatyczne tagowanie dodaje gclid, liczone jako wyszukiwanie płatne z google_ads. Aby zobaczyć nazwy kampanii, dodaj to jako sufiks końcowego adresu URL:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Reklamy Meta (Facebook, Instagram): fbclid jest dodawany automatycznie, liczony jako media społecznościowe z meta. Aby zobaczyć nazwy kampanii, dodaj to do parametrów URL reklamy:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): automatyczne tagowanie dodaje utm_source=seznam i utm_medium=cpc, liczone jako wyszukiwanie płatne z seznam. Bez automatycznego tagowania sznclid jest liczony tak samo.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'Kanał wyznacza utm_medium: cpc, ppc lub paid → wyszukiwanie płatne, z sieci społecznościowej → media społecznościowe; social → media społecznościowe; email lub newsletter → e-mail; display, banner lub cpm → display; affiliate → afiliacja; organic → wyszukiwanie organiczne; referral → odesłania; cokolwiek innego → kampania. Bez utm_medium decyduje utm_source: asystent AI, sieć społecznościowa, wyszukiwarka lub newsletter, w przeciwnym razie kampania.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Inna domena, która prowadzi tutaj (dawna lub krótka): wpisz ją w aliases.hosts w %file%, a tę witrynę jako aliases.target. Rozszerzenie obsłuży wtedy tę domenę, policzy wizytę i przekieruje.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'Kod QR, plakat lub dowolny drukowany link: wskaż adres poniżej i dodaj jego znacznik (tutaj poster-a2) do aliases.hosts.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Jeśli przekierowanie odbywa się gdzie indziej (u rejestratora lub w serwerze WWW), niech dodaje do adresu ?ra_via=<domain>, a aliases.mode ustaw na tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Wizyty przez alias liczą się też w swoim kanale: alias mówi, jakiego adresu użyli, kanał — jak do niego trafili.'

