# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% tem uma ligação para %path%, que não existe (pedidos: %count%).'
'Fix or remove the link on that page.': 'Corrija ou remova a ligação nessa página.'
'Probably %target% was meant: fix the link on that page.': 'Provavelmente pretendia-se %target%: corrija a ligação nessa página.'
'%path% does not exist, and gets %count% requests from %host%.': '%path% não existe e recebe %count% pedidos de %host%.'
'%path% does not exist, and gets %count% requests from other sites.': '%path% não existe e recebe %count% pedidos de outros sites.'
'Redirect it to the page that replaced it.': 'Redirecione-a para a página que a substituiu.'
'Redirect it to %target%.': 'Redirecione-a para %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'As visitas com %subject% abrem desde cerca de %day% apenas %after% páginas por visita em vez de %before%. Os restantes navegadores não mudaram.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'As visitas no dispositivo %subject% abrem desde cerca de %day% apenas %after% páginas por visita em vez de %before%. Os restantes dispositivos não mudaram.'
'Test the site in %subject%, especially what was deployed around that day.': 'Teste o site no %subject%, sobretudo o que foi publicado por volta desse dia.'
'Test the site on %subject%, especially what was deployed around that day.': 'Teste o site no dispositivo %subject%, sobretudo o que foi publicado por volta desse dia.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': 'Em %day%, o Bolt não registou visualizações de página, mas vieram bots: provavelmente uma cache ou CDN responde sem o Bolt, ou a recolha está desativada.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Verifique se os pedidos de páginas chegam ao Bolt e se a extensão está ativada.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': 'Nenhum pedido em %day%: o site provavelmente esteve em baixo, ou a agregação não foi executada.'
'Check the server log of that day, and that the rollup runs.': 'Verifique o registo do servidor desse dia e se a agregação está a ser executada.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': '%host% é contado como referência (visitas: %count%): as passagens entre páginas deste site provavelmente contam como novas visitas.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Adicione %hosts% a %setting% na configuração do Request Analytics.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': '%share% das visitas chegam sem referenciador, e uma visita abre apenas %per_visit% páginas: provavelmente os cliques entre páginas também chegam sem ele, pelo que cada um conta como uma nova visita.'
'Send the header %header%.': 'Envie o cabeçalho %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': '%count% visitas (%share%) vêm de navegadores que pedem primeiro o idioma: %language%. O site não tem páginas nesse idioma, e estas visitas abrem %per_visit% páginas por visita contra %others% das restantes.'
'Translate the pages most visits start on first.': 'Traduza primeiro as páginas em que começam mais visitas.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Traduza primeiro as páginas em que começam mais visitas: %pages% (%pages_share% das visitas começam nelas).'
'%count% searches for %term%, and no page is about it.': '%count% pesquisas por %term%, e nenhuma página trata disso.'
'Write one, or add the word to a page that answers it.': 'Escreva uma, ou acrescente a palavra a uma página que responda a isso.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': '%count% pesquisas por %term%, embora %page% exista: provavelmente é difícil de encontrar.'
'Link it from the menu or the homepage.': 'Coloque uma ligação para ela no menu ou na página inicial.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': '%visit_share% das visitas preferem o idioma: %language%, mais do que o idioma: %default%, mas o idioma predefinido do site é: %default%, e %default_share% das visualizações de página permanecem nele.'
'Make %language% the default language, or offer it on the homepage.': 'Torne o idioma %language% o predefinido, ou ofereça-o na página inicial.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': '%visit_share% das visitas preferem o idioma: %language%, mas apenas %view_share% das visualizações de página estão nesse idioma.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Provavelmente as visitas não encontram o seletor de idioma: coloque-o no cabeçalho, com o nome do idioma e não apenas uma bandeira.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'As visitas encontram o seletor de idioma, mas chegam ao idioma errado: adicione ligações hreflang, coloque as traduções no sitemap e ofereça o idioma %language% nas páginas de entrada (como sugestão, nunca como redirecionamento forçado).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'As visitas encontram o seletor de idioma, mas chegam ao idioma errado: adicione ligações hreflang, coloque as traduções no sitemap e ofereça o idioma %language% nas páginas em que mais se muda de idioma: %pages% (como sugestão, nunca como redirecionamento forçado).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: %count% visualizações de página em 90 dias (%share%), e %visit_share% das visitas preferem este idioma.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Mantê-lo atualizado pode não compensar: traduza só as páginas principais, deixe de traduzir conteúdo novo ou remova o idioma.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% em conjunto: %count% visualizações de página em 90 dias (%share%), e %visit_share% das visitas preferem um deles.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Mantê-los atualizados pode não compensar: traduza só as páginas principais, deixe de traduzir conteúdo novo ou remova alguns idiomas.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Visitas: %change% (%before% → %after%). O canal %channel% representa %share% da perda. As visitas também abrem menos páginas.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Visitas: %change% (%before% → %after%). O canal %channel% representa %share% da perda.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Visitas: %change% (%before% → %after%). O canal %channel% representa %share% da perda, sobretudo %pages%. As visitas também abrem menos páginas.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Visitas: %change% (%before% → %after%). O canal %channel% representa %share% da perda, sobretudo %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Verifique a posição destas páginas nos motores de pesquisa, e se o título ou o endereço delas mudou.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Provavelmente uma publicação ou campanha recorrente parou: verifique o que era publicado lá antes.'
'Probably a linking site removed its link.': 'Provavelmente um site que tinha uma ligação removeu-a.'
'Probably %source% removed its link: check the linking page.': 'Provavelmente %source% removeu a ligação: verifique a página que a tinha.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Verifique os marcadores e as ligações impressas (cartazes, códigos QR) que levam a estas páginas.'
