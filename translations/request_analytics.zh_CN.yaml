'No statistics yet. Insights need %days% complete days of them and then appear here on their own.': '尚无统计数据。洞察需要 %days% 个完整天的统计数据，之后会自动显示在这里。'
'Insights need %days% complete days of statistics (so far: %count%). The first ones can appear on %day%.': '洞察需要 %days% 个完整天的统计数据（目前：%count%）。最早可能在 %day% 出现。'
'Too few visits to tell a real problem from chance (last %days% days: %count%). Insights appear as the site gets more visits.': '访问量太少，无法区分真实问题和偶然波动（最近 %days% 天：%count%）。网站访问量增加后会出现洞察。'
'Nothing needs attention so far. Checks that compare longer periods start once there are %days% days of statistics, on %day%.': '目前没有需要处理的问题。比较更长时间段的检查需要 %days% 天的统计数据，将于 %day% 开始。'
'Nothing needs attention. Broken links, site search, languages, visits and browsers of the last %days% days look fine.': '没有需要处理的问题。最近 %days% 天的失效链接、站内搜索、语言、访问和浏览器均正常。'

# Deleting statistics (administrators and developers)
'Manage statistics': '管理统计数据'
'Delete statistics': '删除统计数据'
'Delete the statistics of the last days, or all of them. Deleted statistics cannot be recovered.': '删除最近几天的统计数据，或删除全部。已删除的统计数据无法恢复。'
'Delete statistics…': '删除统计数据…'
'Close': '关闭'
'Which statistics should be deleted? The period always ends now; older statistics stay as they are.': '要删除哪些统计数据？时间段始终截至现在；更早的统计数据保持不变。'
'Period to delete': '要删除的时间段'
'Today': '今天'
'Last 90 days': '最近 90 天'
'Number of days': '天数'
'Everything': '全部'
'All statistics ever collected': '所有已收集的统计数据'
'From %date%': '自 %date% 起'
'Cancel': '取消'
'Continue': '继续'
'Delete permanently?': '永久删除？'
'The statistics from %date% to now will be deleted:': '将删除从 %date% 至今的统计数据：'
'All statistics will be deleted:': '将删除全部统计数据：'
'All statistics, collected since %date%, will be deleted:': '将删除自 %date% 起收集的全部统计数据：'
'And everything else of these days: pages, sources, devices, languages, site searches, broken links and bots.': '以及这些天的其他所有数据：页面、来源、设备、语言、站内搜索、失效链接和机器人。'
'This cannot be undone. The statistics are erased for good; only a backup of the database can bring them back.': '此操作无法撤销。统计数据将被永久清除；只有数据库备份才能将其恢复。'
'I understand that the deleted statistics cannot be recovered.': '我了解已删除的统计数据无法恢复。'
'Delete permanently': '永久删除'
'The statistics could not be counted.': '无法统计数据数量。'
'The statistics could not be deleted.': '无法删除统计数据。'
'All statistics were deleted.': '已删除全部统计数据。'
'The statistics of the chosen period were deleted.': '已删除所选时间段的统计数据。'
'The statistics are being aggregated right now. Try again in a minute.': '统计数据正在汇总中。请一分钟后重试。'
