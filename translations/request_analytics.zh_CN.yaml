'Unknown': '未知'
'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': '按此顺序判断：链接中的 UTM 参数、广告平台添加的点击 ID（gclid、fbclid 等）、访客来自的页面。'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': '直接访问：手动输入的网址、书签或不提供任何信息的应用。未知：没有任何线索。'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': '在发布的链接中添加 UTM 参数：utm_campaign 为活动命名，utm_source 表示位置，utm_medium 表示渠道类型。'
'Newsletter': '邮件通讯'
'Social media post': '社交媒体帖子'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads：自动标记会添加 gclid，计为来自 google_ads 的付费搜索。若要看到活动名称，请将以下内容添加为最终网址后缀：'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Meta 广告（Facebook、Instagram）：会自动添加 fbclid，计为来自 meta 的社交媒体。若要看到活动名称，请将以下内容添加到广告的网址参数中：'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik（Seznam）：自动标记会添加 utm_source=seznam 和 utm_medium=cpc，计为来自 seznam 的付费搜索。未启用自动标记时，sznclid 也按同样方式计算。'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': '渠道由 utm_medium 决定：cpc、ppc 或 paid → 付费搜索（来自社交网络时为社交媒体）；social → 社交媒体；email 或 newsletter → 电子邮件；display、banner 或 cpm → 展示广告；affiliate → 联盟推广；organic → 自然搜索；referral → 外部链接；其他 → 营销活动。没有 utm_medium 时由 utm_source 决定：AI 助手、社交网络、搜索引擎或电子报，否则为营销活动。'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': '通向本站的其他域名（旧域名或短域名）：在 %file% 的 aliases.hosts 中列出它，并将本站设为 aliases.target。扩展会响应该域名、记录访问并重定向。'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': '二维码、海报或任何印刷链接：指向下方的地址，并将其标记（此处为 poster-a2）添加到 aliases.hosts。'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': '如果重定向在别处进行（在域名注册商或 Web 服务器中），请让它在地址后添加 ?ra_via=<domain>，并将 aliases.mode 设为 tag。'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': '通过别名的访问也会计入其渠道：别名说明他们使用了哪个地址，渠道说明他们如何到达该地址。'

