'A request is a bot when its User-Agent names one, or when its headers contradict the browser it claims to be. Bots are not counted in page views, visits or any other card. AI crawlers collect pages for AI models and answer engines; robots.txt can ask them to stay away.': '当请求的 User-Agent 表明是机器人，或其请求头与其声称的浏览器矛盾时，即视为机器人。机器人不计入页面浏览、访问或任何其他卡片。AI 爬虫为 AI 模型和答案引擎收集页面；可通过 robots.txt 要求它们不要抓取。'
