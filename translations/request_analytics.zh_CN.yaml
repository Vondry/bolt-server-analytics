# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% 链接到 %path%，但该页面不存在（请求：%count%）。'
'Fix or remove the link on that page.': '请修正或删除该页面上的链接。'
'Probably %target% was meant: fix the link on that page.': '原本可能指的是 %target%：请修正该页面上的链接。'
'%path% does not exist, and gets %count% requests from %host%.': '%path% 不存在，却有 %count% 次请求来自 %host%。'
'%path% does not exist, and gets %count% requests from other sites.': '%path% 不存在，却有 %count% 次请求来自其他网站。'
'Redirect it to the page that replaced it.': '请将其重定向到替代它的页面。'
'Redirect it to %target%.': '请将其重定向到 %target%。'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': '使用 %subject% 的访问大约从 %day% 起每次访问只打开 %after% 个页面，之前为 %before%。其他浏览器没有变化。'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': '来自 %subject% 设备的访问大约从 %day% 起每次访问只打开 %after% 个页面，之前为 %before%。其他设备没有变化。'
'Test the site in %subject%, especially what was deployed around that day.': '请在 %subject% 中测试网站，尤其是那天前后上线的内容。'
'Test the site on %subject%, especially what was deployed around that day.': '请在 %subject% 设备上测试网站，尤其是那天前后上线的内容。'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': '%day% Bolt 没有记录到任何页面浏览，但有机器人来访：可能是缓存或 CDN 在绕过 Bolt 直接响应，或者数据收集已关闭。'
'Check that page requests reach Bolt, and that the extension is enabled.': '请检查页面请求是否到达 Bolt，以及扩展是否已启用。'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': '%day% 没有任何请求：网站可能当时无法访问，或者汇总没有运行。'
'Check the server log of that day, and that the rollup runs.': '请检查当天的服务器日志，并确认汇总在运行。'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': '%host% 被计为外部链接（访问：%count%）：本站页面之间的跳转可能被计为新的访问。'
'Add %hosts% to %setting% in the config of Request Analytics.': '请在 Request Analytics 配置的 %setting% 中添加 %hosts%。'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': '%share% 的访问没有来源页（Referer），且每次访问只打开 %per_visit% 个页面：页面之间的点击可能也没有来源页，因此每次点击都被计为一次新访问。'
'Send the header %header%.': '请发送响应头 %header%。'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': '%count% 次访问（%share%）来自首选语言为 %language% 的浏览器。网站没有该语言的页面，这些访问每次只打开 %per_visit% 个页面，其他访问为 %others%。'
'Translate the pages most visits start on first.': '请先翻译访问最常起始的页面。'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': '请先翻译访问最常起始的页面：%pages%（%pages_share% 的访问从这里开始）。'
'%count% searches for %term%, and no page is about it.': '%term% 被搜索了 %count% 次，但没有相关页面。'
'Write one, or add the word to a page that answers it.': '请写一个页面，或把这个词加到能回答它的页面上。'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': '%term% 被搜索了 %count% 次，而 %page% 是存在的：它可能很难被找到。'
'Link it from the menu or the homepage.': '请在菜单或首页中链接到它。'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': '%visit_share% 的访问偏好 %language%，多于 %default%，但网站的默认语言是 %default%，且 %default_share% 的页面浏览停留在该语言。'
'Make %language% the default language, or offer it on the homepage.': '请将 %language% 设为默认语言，或在首页提供它。'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': '%visit_share% 的访问偏好 %language%，但只有 %view_share% 的页面浏览是 %language%。'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': '访问可能找不到语言切换器：请把它放在页眉，并显示语言名称，而不只是旗帜。'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': '访问能找到语言切换器，但进入了错误的语言：请添加 hreflang 链接，把译文加入站点地图，并在入口页面提供 %language%（作为建议，绝不强制重定向）。'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': '访问能找到语言切换器，但进入了错误的语言：请添加 hreflang 链接，把译文加入站点地图，并在最常切换语言的页面提供 %language%：%pages%（作为建议，绝不强制重定向）。'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%：90 天内 %count% 次页面浏览（%share%），%visit_share% 的访问偏好该语言。'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': '保持它的更新可能不值得：只翻译关键页面，停止翻译新内容，或删除该语言。'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% 合计：90 天内 %count% 次页面浏览（%share%），%visit_share% 的访问偏好其中之一。'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': '保持它们的更新可能不值得：只翻译关键页面，停止翻译新内容，或删除部分语言。'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': '访问：%change%（%before% → %after%）。%channel% 渠道占减少量的 %share%。每次访问打开的页面也更少了。'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': '访问：%change%（%before% → %after%）。%channel% 渠道占减少量的 %share%。'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': '访问：%change%（%before% → %after%）。%channel% 渠道占减少量的 %share%，主要是 %pages%。每次访问打开的页面也更少了。'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': '访问：%change%（%before% → %after%）。%channel% 渠道占减少量的 %share%，主要是 %pages%。'
'Check the search ranking of these pages, and whether their title or address changed.': '请检查这些页面的搜索排名，以及它们的标题或地址是否有变化。'
'Probably a recurring post or campaign stopped: check what was published there before.': '可能是某个定期发布的帖子或活动停止了：请检查那里以前发布的内容。'
'Probably a linking site removed its link.': '可能某个链接到本站的网站删除了链接。'
'Probably %source% removed its link: check the linking page.': '可能 %source% 删除了链接：请检查原来链接到本站的页面。'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': '请检查指向这些页面的书签和印刷链接（海报、二维码）。'
'Setup': '设置'
'Fix': '修复'
'Grow': '增长'
'Decide': '决策'
