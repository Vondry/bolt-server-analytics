'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'În această ordine: parametrii UTM ai linkului, ID-ul de clic adăugat de o rețea de reclame (gclid, fbclid, …), pagina de pe care a venit vizitatorul.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Direct: o adresă tastată, un marcaj sau o aplicație care nu spune nimic. Necunoscut: niciun indiciu.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Adăugați parametri UTM la linkurile pe care le publicați: utm_campaign numește campania, utm_source locul, utm_medium tipul de canal.'
'Newsletter': 'Newsletter'
