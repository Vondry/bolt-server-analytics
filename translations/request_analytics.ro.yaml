# Deleting statistics (administrators and developers)
'Manage statistics': 'Gestionare statistici'
'Delete statistics': 'Ștergere statistici'
'Delete the statistics of the last days, or all of them. Deleted statistics cannot be recovered.': 'Șterge statisticile ultimelor zile sau pe toate. Statisticile șterse nu pot fi recuperate.'
'Delete statistics…': 'Ștergere statistici…'
'Close': 'Închide'
'Which statistics should be deleted? The period always ends now; older statistics stay as they are.': 'Ce statistici doriți să ștergeți? Perioada se încheie întotdeauna acum; statisticile mai vechi rămân neschimbate.'
'Period to delete': 'Perioada de șters'
'Today': 'Astăzi'
'Last 90 days': 'Ultimele 90 de zile'
'Number of days': 'Număr de zile'
'Everything': 'Tot'
'All statistics ever collected': 'Toate statisticile colectate'
'From %date%': 'Din %date%'
'Cancel': 'Anulare'
'Continue': 'Continuare'
'Delete permanently?': 'Ștergeți definitiv?'
'The statistics from %date% to now will be deleted:': 'Statisticile din %date% până acum vor fi șterse:'
'All statistics will be deleted:': 'Toate statisticile vor fi șterse:'
'All statistics, collected since %date%, will be deleted:': 'Toate statisticile, colectate din %date%, vor fi șterse:'
'And everything else of these days: pages, sources, devices, languages, site searches, broken links and bots.': 'Și tot restul acestor zile: pagini, surse, dispozitive, limbi, căutări pe site, linkuri nefuncționale și boți.'
'This cannot be undone. The statistics are erased for good; only a backup of the database can bring them back.': 'Această acțiune este ireversibilă. Statisticile sunt șterse definitiv; doar o copie de rezervă a bazei de date le poate readuce.'
'I understand that the deleted statistics cannot be recovered.': 'Înțeleg că statisticile șterse nu pot fi recuperate.'
'Delete permanently': 'Șterge definitiv'
'The statistics could not be counted.': 'Statisticile nu au putut fi numărate.'
'The statistics could not be deleted.': 'Statisticile nu au putut fi șterse.'
'All statistics were deleted.': 'Toate statisticile au fost șterse.'
'The statistics of the chosen period were deleted.': 'Statisticile perioadei alese au fost șterse.'
'The statistics are being aggregated right now. Try again in a minute.': 'Statisticile sunt agregate chiar acum. Încercați din nou peste un minut.'
