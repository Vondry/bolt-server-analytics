'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: etichetarea automată adaugă gclid, numărat drept căutare plătită de la google_ads. Pentru numele campaniilor, adăugați acest sufix la adresa URL finală:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Reclame Meta (Facebook, Instagram): fbclid se adaugă automat, numărat drept rețele sociale de la meta. Pentru numele campaniilor, adăugați acest text la parametrii URL ai reclamei:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): etichetarea automată adaugă utm_source=seznam și utm_medium=cpc, numărat drept căutare plătită de la seznam. Fără etichetare automată, sznclid se numără la fel.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'utm_medium decide canalul: cpc, ppc sau paid → căutare plătită, de la o rețea socială → rețele sociale; social → rețele sociale; email sau newsletter → e-mail; display, banner sau cpm → display; affiliate → afiliere; organic → căutare organică; referral → trimiteri; orice altceva → campanie. Fără utm_medium decide utm_source: un asistent AI, o rețea socială, un motor de căutare sau un newsletter, altfel campanie.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Un alt domeniu care duce aici (unul vechi sau unul scurt): treceți-l în aliases.hosts din %file%, cu acest site ca aliases.target. Extensia răspunde atunci acelui domeniu, numără vizita și redirecționează.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'Un cod QR, un afiș sau orice link tipărit: trimiteți la adresa de mai jos și adăugați marcajul ei (aici poster-a2) în aliases.hosts.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Dacă redirecționarea se face în altă parte (la registrar sau în serverul web), lăsați-o să adauge ?ra_via=<domain> la adresă și setați aliases.mode pe tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Vizitele printr-un alias se numără și în canalul lor: aliasul spune ce adresă au folosit, canalul cum au ajuns la ea.'

