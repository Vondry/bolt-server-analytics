# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% trimite la %path%, care nu există (cereri: %count%).'
'Fix or remove the link on that page.': 'Corectați sau eliminați linkul de pe acea pagină.'
'Probably %target% was meant: fix the link on that page.': 'Probabil era vorba de %target%: corectați linkul de pe acea pagină.'
'%path% does not exist, and gets %count% requests from %host%.': '%path% nu există și primește %count% cereri de la %host%.'
'%path% does not exist, and gets %count% requests from other sites.': '%path% nu există și primește %count% cereri de la alte site-uri.'
'Redirect it to the page that replaced it.': 'Redirecționați-o către pagina care a înlocuit-o.'
'Redirect it to %target%.': 'Redirecționați-o către %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Vizitele din %subject% deschid, începând cam din %day%, doar %after% pagini pe vizită în loc de %before%. Celelalte browsere nu s-au schimbat.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Vizitele de pe dispozitivul %subject% deschid, începând cam din %day%, doar %after% pagini pe vizită în loc de %before%. Celelalte dispozitive nu s-au schimbat.'
'Test the site in %subject%, especially what was deployed around that day.': 'Testați site-ul în %subject%, mai ales ce s-a publicat în jurul acelei zile.'
'Test the site on %subject%, especially what was deployed around that day.': 'Testați site-ul pe dispozitivul %subject%, mai ales ce s-a publicat în jurul acelei zile.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': 'Pe %day%, Bolt nu a înregistrat nicio afișare de pagină, dar au venit boți: probabil un cache sau un CDN răspunde fără Bolt, sau colectarea este oprită.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Verificați că cererile de pagini ajung la Bolt și că extensia este activată.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': 'Nicio cerere pe %day%: site-ul a fost probabil indisponibil, sau agregarea nu a rulat.'
'Check the server log of that day, and that the rollup runs.': 'Verificați jurnalul serverului din acea zi și că agregarea rulează.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': '%host% este numărat ca trimitere (vizite: %count%): trecerile între paginile acestui site sunt probabil numărate ca vizite noi.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Adăugați %hosts% la %setting% în configurația Request Analytics.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': '%share% din vizite sosesc fără referrer, iar o vizită deschide doar %per_visit% pagini: probabil și clicurile între pagini sosesc fără el, așa că fiecare contează ca o vizită nouă.'
'Send the header %header%.': 'Trimiteți antetul %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': '%count% vizite (%share%) vin din browsere care cer întâi limba: %language%. Site-ul nu are pagini în această limbă, iar aceste vizite deschid %per_visit% pagini pe vizită față de %others% la celelalte.'
'Translate the pages most visits start on first.': 'Traduceți întâi paginile pe care încep cele mai multe vizite.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Traduceți întâi paginile pe care încep cele mai multe vizite: %pages% (acolo încep %pages_share% din vizite).'
'%count% searches for %term%, and no page is about it.': '%count% căutări pentru %term%, și nicio pagină nu tratează subiectul.'
'Write one, or add the word to a page that answers it.': 'Scrieți una, sau adăugați cuvântul pe o pagină care răspunde.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': '%count% căutări pentru %term%, deși %page% există: probabil este greu de găsit.'
'Link it from the menu or the homepage.': 'Puneți un link către ea în meniu sau pe pagina principală.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': '%visit_share% din vizite preferă limba: %language%, mai mult decât limba: %default%, dar limba implicită a site-ului este: %default%, iar %default_share% din afișările de pagină rămân în ea.'
'Make %language% the default language, or offer it on the homepage.': 'Faceți limba %language% implicită, sau oferiți-o pe pagina principală.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': '%visit_share% din vizite preferă limba: %language%, dar doar %view_share% din afișările de pagină sunt în această limbă.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Probabil vizitele nu găsesc selectorul de limbă: puneți-l în antet, cu numele limbii, nu doar cu un steag.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'Vizitele găsesc selectorul de limbă, dar ajung la limba greșită: adăugați linkuri hreflang, puneți traducerile în sitemap și oferiți limba %language% pe paginile de intrare (ca sugestie, niciodată ca redirecționare forțată).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'Vizitele găsesc selectorul de limbă, dar ajung la limba greșită: adăugați linkuri hreflang, puneți traducerile în sitemap și oferiți limba %language% pe paginile unde se schimbă cel mai des limba: %pages% (ca sugestie, niciodată ca redirecționare forțată).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: %count% afișări de pagină în 90 de zile (%share%), iar %visit_share% din vizite preferă această limbă.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Menținerea ei la zi s-ar putea să nu merite: traduceți doar paginile cheie, nu mai traduceți conținutul nou, sau eliminați limba.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% împreună: %count% afișări de pagină în 90 de zile (%share%), iar %visit_share% din vizite preferă una dintre ele.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Menținerea lor la zi s-ar putea să nu merite: traduceți doar paginile cheie, nu mai traduceți conținutul nou, sau eliminați unele limbi.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Vizite: %change% (%before% → %after%). Canalul %channel% reprezintă %share% din pierdere. Vizitele deschid și mai puține pagini.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Vizite: %change% (%before% → %after%). Canalul %channel% reprezintă %share% din pierdere.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Vizite: %change% (%before% → %after%). Canalul %channel% reprezintă %share% din pierdere, mai ales %pages%. Vizitele deschid și mai puține pagini.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Vizite: %change% (%before% → %after%). Canalul %channel% reprezintă %share% din pierdere, mai ales %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Verificați poziția acestor pagini în motoarele de căutare și dacă titlul sau adresa lor s-a schimbat.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Probabil s-a oprit o postare sau o campanie recurentă: verificați ce se publica acolo înainte.'
'Probably a linking site removed its link.': 'Probabil un site care trimitea aici a eliminat linkul.'
'Probably %source% removed its link: check the linking page.': 'Probabil %source% a eliminat linkul: verificați pagina care trimitea aici.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Verificați marcajele și linkurile tipărite (afișe, coduri QR) care duc la aceste pagini.'
