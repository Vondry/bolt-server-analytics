'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'En este orden: los parámetros UTM del enlace, el ID de clic que añade una red publicitaria (gclid, fbclid, …), la página de la que vino el visitante.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Directo: una dirección escrita, un marcador o una app que no dice nada. Desconocido: ninguna pista.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Añada parámetros UTM a los enlaces que publique: utm_campaign nombra la campaña, utm_source el lugar, utm_medium el tipo de canal.'
'Newsletter': 'Boletín'
'Social media post': 'Publicación en redes sociales'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: el etiquetado automático añade gclid, contado como búsqueda de pago de google_ads. Para ver los nombres de las campañas, añada esto como sufijo de la URL final:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Anuncios de Meta (Facebook, Instagram): fbclid se añade automáticamente, contado como redes sociales de meta. Para ver los nombres de las campañas, añada esto a los parámetros de URL del anuncio:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): el etiquetado automático añade utm_source=seznam y utm_medium=cpc, contado como búsqueda de pago de seznam. Sin etiquetado automático, sznclid se cuenta igual.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'utm_medium decide el canal: cpc, ppc o paid → búsqueda de pago, desde una red social → redes sociales; social → redes sociales; email o newsletter → correo electrónico; display, banner o cpm → display; affiliate → afiliados; organic → búsqueda orgánica; referral → referencias; cualquier otro → campaña. Sin utm_medium decide utm_source: un asistente de IA, una red social, un buscador o un boletín; si no, campaña.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Otro dominio que lleva aquí (uno anterior o uno corto): inclúyalo en aliases.hosts de %file%, con este sitio como aliases.target. La extensión responde a ese dominio, cuenta la visita y redirige.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'Un código QR, un cartel o cualquier enlace impreso: enlace a la dirección de abajo y añada su marca (aquí poster-a2) a aliases.hosts.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Si la redirección ocurre en otro sitio (en el registrador o en el servidor web), haga que añada ?ra_via=<domain> a la dirección y ponga aliases.mode en tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Las visitas a través de un alias también cuentan en su canal: el alias indica qué dirección usaron, el canal cómo llegaron a ella.'

