# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% enlaza a %path%, que no existe (solicitudes: %count%).'
'Fix or remove the link on that page.': 'Corrija o elimine el enlace en esa página.'
'Probably %target% was meant: fix the link on that page.': 'Probablemente se refería a %target%: corrija el enlace en esa página.'
'%path% does not exist, and gets %count% requests from %host%.': '%path% no existe y recibe %count% solicitudes desde %host%.'
'%path% does not exist, and gets %count% requests from other sites.': '%path% no existe y recibe %count% solicitudes desde otros sitios.'
'Redirect it to the page that replaced it.': 'Redirígela a la página que la sustituyó.'
'Redirect it to %target%.': 'Redirígela a %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Las visitas con %subject% abren desde aproximadamente el %day% solo %after% páginas por visita en lugar de %before%. Los demás navegadores no han cambiado.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Las visitas en el dispositivo %subject% abren desde aproximadamente el %day% solo %after% páginas por visita en lugar de %before%. Los demás dispositivos no han cambiado.'
'Test the site in %subject%, especially what was deployed around that day.': 'Pruebe el sitio en %subject%, sobre todo lo que se publicó alrededor de ese día.'
'Test the site on %subject%, especially what was deployed around that day.': 'Pruebe el sitio en el dispositivo %subject%, sobre todo lo que se publicó alrededor de ese día.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': 'El %day%, Bolt no registró páginas vistas, pero llegaron bots: probablemente una caché o CDN responde sin Bolt, o la recopilación está desactivada.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Compruebe que las solicitudes de páginas llegan a Bolt y que la extensión está activada.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': 'Ninguna solicitud el %day%: probablemente el sitio estaba caído, o la agregación no se ejecutó.'
'Check the server log of that day, and that the rollup runs.': 'Revise el registro del servidor de ese día y que la agregación se ejecuta.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': '%host% se cuenta como referencia (visitas: %count%): probablemente los pasos entre páginas de este sitio cuentan como visitas nuevas.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Añada %hosts% a %setting% en la configuración de Request Analytics.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': '%share% de las visitas llegan sin referente, y una visita abre solo %per_visit% páginas: probablemente los clics entre páginas también llegan sin él, así que cada uno cuenta como una visita nueva.'
'Send the header %header%.': 'Envíe la cabecera %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': '%count% visitas (%share%) vienen de navegadores que piden primero el idioma: %language%. El sitio no tiene páginas en ese idioma, y estas visitas abren %per_visit% páginas por visita frente a %others% de las demás.'
'Translate the pages most visits start on first.': 'Traduzca primero las páginas en las que empiezan más visitas.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Traduzca primero las páginas en las que empiezan más visitas: %pages% (ahí empiezan el %pages_share% de las visitas).'
'%count% searches for %term%, and no page is about it.': '%count% búsquedas de %term%, y ninguna página trata de ello.'
'Write one, or add the word to a page that answers it.': 'Escriba una, o añada la palabra a una página que lo responda.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': '%count% búsquedas de %term%, aunque %page% existe: probablemente es difícil de encontrar.'
'Link it from the menu or the homepage.': 'Enlácela desde el menú o la página de inicio.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': 'El %visit_share% de las visitas prefiere el idioma: %language%, más que el idioma: %default%, pero el idioma predeterminado del sitio es: %default%, y el %default_share% de las páginas vistas se queda en él.'
'Make %language% the default language, or offer it on the homepage.': 'Haga del idioma %language% el idioma predeterminado, u ofrézcalo en la página de inicio.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': 'El %visit_share% de las visitas prefiere el idioma: %language%, pero solo el %view_share% de las páginas vistas está en ese idioma.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Probablemente las visitas no encuentran el selector de idioma: póngalo en la cabecera, con el nombre del idioma y no solo una bandera.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'Las visitas encuentran el selector de idioma, pero llegan al idioma equivocado: añada enlaces hreflang, incluya las traducciones en el sitemap y ofrezca el idioma %language% en las páginas de entrada (como sugerencia, nunca como redirección forzada).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'Las visitas encuentran el selector de idioma, pero llegan al idioma equivocado: añada enlaces hreflang, incluya las traducciones en el sitemap y ofrezca el idioma %language% en las páginas donde más se cambia de idioma: %pages% (como sugerencia, nunca como redirección forzada).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: %count% páginas vistas en 90 días (%share%), y el %visit_share% de las visitas prefiere este idioma.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Mantenerlo al día quizá no compense: traduzca solo las páginas clave, deje de traducir el contenido nuevo o elimine el idioma.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% juntos: %count% páginas vistas en 90 días (%share%), y el %visit_share% de las visitas prefiere uno de ellos.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Mantenerlos al día quizá no compense: traduzca solo las páginas clave, deje de traducir el contenido nuevo o elimine algunos idiomas.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Visitas: %change% (%before% → %after%). El canal %channel% supone el %share% de la pérdida. Las visitas también abren menos páginas.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Visitas: %change% (%before% → %after%). El canal %channel% supone el %share% de la pérdida.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Visitas: %change% (%before% → %after%). El canal %channel% supone el %share% de la pérdida, sobre todo %pages%. Las visitas también abren menos páginas.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Visitas: %change% (%before% → %after%). El canal %channel% supone el %share% de la pérdida, sobre todo %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Revise la posición de estas páginas en los buscadores, y si cambió su título o su dirección.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Probablemente se detuvo una publicación o campaña recurrente: revise qué se publicaba allí antes.'
'Probably a linking site removed its link.': 'Probablemente un sitio que enlazaba retiró su enlace.'
'Probably %source% removed its link: check the linking page.': 'Probablemente %source% retiró su enlace: revise la página que enlazaba.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Revise los marcadores y los enlaces impresos (carteles, códigos QR) que llevan a estas páginas.'
