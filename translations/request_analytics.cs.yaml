'Delete statistics…': 'Smazat statistiky…'
'Close': 'Zavřít'
'Which statistics should be deleted? The period always ends now; older statistics stay as they are.': 'Které statistiky chcete smazat? Období vždy končí teď; starší statistiky zůstanou beze změny.'
'Period to delete': 'Období ke smazání'
