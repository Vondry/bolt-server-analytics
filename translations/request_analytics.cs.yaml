'A request is a bot when its User-Agent names one, or when its headers contradict the browser it claims to be. Bots are not counted in page views, visits or any other card. AI crawlers collect pages for AI models and answer engines; robots.txt can ask them to stay away.': 'Požadavek je bot, když se jako bot představí v User-Agent, nebo když si jeho hlavičky odporují s prohlížečem, za který se vydává. Boti se nepočítají do zobrazení, návštěv ani jiné karty. AI crawlery sbírají stránky pro AI modely a odpovědní vyhledávače; v robots.txt je lze požádat, aby web vynechaly.'
