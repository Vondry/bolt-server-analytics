# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% odkazuje na stránku %path%, která neexistuje (počet požadavků: %count%).'
'Fix or remove the link on that page.': 'Opravte nebo odstraňte odkaz na této stránce.'
'Probably %target% was meant: fix the link on that page.': 'Odkaz měl nejspíš vést na %target%: opravte ho na této stránce.'
'%path% does not exist, and gets %count% requests from %host%.': 'Stránka %path% neexistuje a míří na ni %count% požadavků z webu %host%.'
'%path% does not exist, and gets %count% requests from other sites.': 'Stránka %path% neexistuje a míří na ni %count% požadavků z jiných webů.'
'Redirect it to the page that replaced it.': 'Přesměrujte ji na stránku, která ji nahradila.'
'Redirect it to %target%.': 'Přesměrujte ji na %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Návštěvy v prohlížeči %subject% otevírají zhruba od %day% jen %after% stránky na návštěvu místo %before%. U ostatních prohlížečů se nic nezměnilo.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Návštěvy na zařízení %subject% otevírají zhruba od %day% jen %after% stránky na návštěvu místo %before%. U ostatních zařízení se nic nezměnilo.'
'Test the site in %subject%, especially what was deployed around that day.': 'Otestujte web v prohlížeči %subject%, hlavně to, co se kolem toho dne nasazovalo.'
'Test the site on %subject%, especially what was deployed around that day.': 'Otestujte web na zařízení %subject%, hlavně to, co se kolem toho dne nasazovalo.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': 'Dne %day% Bolt nezaznamenal žádné zobrazení stránky, ale boti přišli: nejspíš odpovídá cache nebo CDN bez Boltu, nebo je sběr vypnutý.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Ověřte, že požadavky na stránky dojdou až k Boltu a že je rozšíření zapnuté.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': 'Dne %day% nepřišel vůbec žádný požadavek: web byl nejspíš nedostupný, nebo neproběhla agregace.'
'Check the server log of that day, and that the rollup runs.': 'Zkontrolujte log serveru z toho dne a to, že agregace běží.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': '%host% se počítá jako odkaz z jiného webu (návštěv: %count%): přechody mezi stránkami tohoto webu se nejspíš počítají jako nové návštěvy.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Přidejte %hosts% do %setting% v konfiguraci Request Analytics.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': '%share% návštěv přichází bez refereru a návštěva otevře jen %per_visit% stránky: nejspíš ho nemají ani kliknutí mezi stránkami, takže se každé počítá jako nová návštěva.'
'Send the header %header%.': 'Posílejte hlavičku %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': '%count% návštěv (%share%) má v prohlížeči na prvním místě jazyk %language%. Web v něm nemá žádné stránky a tyto návštěvy otevřou %per_visit% stránky na návštěvu, ostatní %others%.'
'Translate the pages most visits start on first.': 'Přeložte nejdřív stránky, na kterých začíná nejvíc návštěv.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Přeložte nejdřív stránky, na kterých začíná nejvíc návštěv: %pages% (začíná na nich %pages_share% návštěv).'
'%count% searches for %term%, and no page is about it.': '%count% hledání výrazu %term% a žádná stránka o něm není.'
'Write one, or add the word to a page that answers it.': 'Napište ji, nebo to slovo doplňte na stránku, která na něj odpovídá.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': '%count% hledání výrazu %term%, přitom stránka %page% existuje: nejspíš je špatně k nalezení.'
'Link it from the menu or the homepage.': 'Odkažte na ni z menu nebo z úvodní stránky.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': '%visit_share% návštěv preferuje jazyk %language%, víc než jazyk %default%, ale výchozí jazyk webu je %default% a zůstává v něm %default_share% zobrazení stránek.'
'Make %language% the default language, or offer it on the homepage.': 'Nastavte jako výchozí jazyk %language%, nebo ho nabídněte na úvodní stránce.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': '%visit_share% návštěv preferuje jazyk %language%, ale jazyk %language% má jen %view_share% zobrazení stránek.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Návštěvy nejspíš nenacházejí přepínač jazyků: dejte ho do hlavičky, s názvem jazyka, ne jen s vlajkou.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'Návštěvy přepínač jazyků najdou, ale přicházejí na špatný jazyk: doplňte odkazy hreflang, dejte překlady do sitemapy a na vstupních stránkách nabídněte jazyk %language% (jako nabídku, nikdy vynucené přesměrování).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'Návštěvy přepínač jazyků najdou, ale přicházejí na špatný jazyk: doplňte odkazy hreflang, dejte překlady do sitemapy a jazyk %language% nabídněte na stránkách, kde se přepíná nejčastěji: %pages% (jako nabídku, nikdy vynucené přesměrování).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: %count% zobrazení stránek za 90 dní (%share%) a tento jazyk preferuje %visit_share% návštěv.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Udržovat ho aktuální se nemusí vyplatit: překládejte jen klíčové stránky, přestaňte překládat nový obsah, nebo jazyk odstraňte.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% dohromady: %count% zobrazení stránek za 90 dní (%share%) a některý z těchto jazyků preferuje %visit_share% návštěv.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Udržovat je aktuální se nemusí vyplatit: překládejte jen klíčové stránky, přestaňte překládat nový obsah, nebo některé jazyky odstraňte.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Návštěvy: %change% (%before% → %after%). Kanál %channel% tvoří %share% úbytku. Návštěvy navíc otevírají méně stránek.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Návštěvy: %change% (%before% → %after%). Kanál %channel% tvoří %share% úbytku.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Návštěvy: %change% (%before% → %after%). Kanál %channel% tvoří %share% úbytku, hlavně %pages%. Návštěvy navíc otevírají méně stránek.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Návštěvy: %change% (%before% → %after%). Kanál %channel% tvoří %share% úbytku, hlavně %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Zkontrolujte pozice těchto stránek ve vyhledávání a zda se nezměnil jejich titulek nebo adresa.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Nejspíš skončil pravidelný příspěvek nebo kampaň: zkontrolujte, co se tam dřív publikovalo.'
'Probably a linking site removed its link.': 'Nejspíš některý web odstranil odkaz.'
'Probably %source% removed its link: check the linking page.': 'Nejspíš web %source% odstranil odkaz: zkontrolujte odkazující stránku.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Zkontrolujte záložky a tištěné odkazy (plakáty, QR kódy), které vedou na tyto stránky.'
