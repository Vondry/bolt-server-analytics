'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'V tomto pořadí: UTM parametry odkazu, ID kliknutí, které přidá reklamní síť (gclid, fbclid, …), stránka, ze které návštěvník přišel.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Přímo: zadaná adresa, záložka nebo aplikace, která nic neprozradí. Neznámé: žádné vodítko.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Přidejte UTM parametry k odkazům, které zveřejňujete: utm_campaign pojmenuje kampaň, utm_source místo, utm_medium druh kanálu.'
'Newsletter': 'Newsletter'
'Social media post': 'Příspěvek na sociálních sítích'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: automatické značkování přidá gclid, počítá se jako placené vyhledávání ze zdroje google_ads. Pro názvy kampaní přidejte jako příponu konečné URL:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Reklamy Meta (Facebook, Instagram): fbclid se přidá automaticky, počítá se jako sociální sítě ze zdroje meta. Pro názvy kampaní přidejte do parametrů URL reklamy:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): automatické značkování přidá utm_source=seznam a utm_medium=cpc, počítá se jako placené vyhledávání ze zdroje seznam. Bez automatického značkování se stejně počítá sznclid.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'Kanál určuje utm_medium: cpc, ppc nebo paid → placené vyhledávání, ze sociální sítě → sociální sítě; social → sociální sítě; email nebo newsletter → e-mail; display, banner nebo cpm → bannery; affiliate → affiliate; organic → vyhledávače; referral → odkazy z webů; cokoli jiného → kampaň. Bez utm_medium rozhoduje utm_source: AI asistent, sociální síť, vyhledávač nebo newsletter, jinak kampaň.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Jiná doména, která vede sem (dřívější nebo zkrácená): uveďte ji v aliases.hosts v souboru %file% a tento web jako aliases.target. Rozšíření pak na té doméně odpovídá, započítá návštěvu a přesměruje.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'QR kód, plakát nebo jakýkoli tištěný odkaz: odkažte na adresu níže a přidejte její značku (zde poster-a2) do aliases.hosts.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Pokud přesměrování probíhá jinde (u registrátora nebo ve webovém serveru), ať k adrese přidá ?ra_via=<domain>, a nastavte aliases.mode na tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Návštěvy přes alias se počítají i ve svém kanálu: alias říká, jakou adresu použili, kanál, jak se k ní dostali.'

