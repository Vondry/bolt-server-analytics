'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'Με αυτή τη σειρά: οι παράμετροι UTM του συνδέσμου, το αναγνωριστικό κλικ που προσθέτει ένα διαφημιστικό δίκτυο (gclid, fbclid, …), η σελίδα από την οποία ήρθε ο επισκέπτης.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Άμεσα: μια πληκτρολογημένη διεύθυνση, ένας σελιδοδείκτης ή μια εφαρμογή που δεν λέει τίποτα. Άγνωστο: καμία ένδειξη.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Προσθέστε παραμέτρους UTM στους συνδέσμους που δημοσιεύετε: το utm_campaign ονομάζει την καμπάνια, το utm_source το σημείο, το utm_medium το είδος του καναλιού.'
'Newsletter': 'Ενημερωτικό δελτίο'
'Social media post': 'Ανάρτηση σε κοινωνικά δίκτυα'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: η αυτόματη επισήμανση προσθέτει gclid, μετράει ως πληρωμένη αναζήτηση από google_ads. Για να βλέπετε ονόματα καμπανιών, προσθέστε αυτό ως επίθημα του τελικού URL:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Διαφημίσεις Meta (Facebook, Instagram): το fbclid προστίθεται αυτόματα, μετράει ως κοινωνικά δίκτυα από meta. Για να βλέπετε ονόματα καμπανιών, προσθέστε αυτό στις παραμέτρους URL της διαφήμισης:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): η αυτόματη επισήμανση προσθέτει utm_source=seznam και utm_medium=cpc, μετράει ως πληρωμένη αναζήτηση από seznam. Χωρίς αυτόματη επισήμανση, το sznclid μετράει με τον ίδιο τρόπο.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'Το κανάλι το ορίζει το utm_medium: cpc, ppc ή paid → πληρωμένη αναζήτηση, από κοινωνικό δίκτυο → κοινωνικά δίκτυα· social → κοινωνικά δίκτυα· email ή newsletter → email· display, banner ή cpm → διαφήμιση display· affiliate → συνεργάτες· organic → οργανική αναζήτηση· referral → παραπομπές· οτιδήποτε άλλο → καμπάνια. Χωρίς utm_medium αποφασίζει το utm_source: βοηθός AI, κοινωνικό δίκτυο, μηχανή αναζήτησης ή newsletter, αλλιώς καμπάνια.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Ένας άλλος τομέας που οδηγεί εδώ (παλιός ή σύντομος): προσθέστε τον στο aliases.hosts του %file%, με αυτόν τον ιστότοπο ως aliases.target. Η επέκταση απαντά τότε σε αυτόν τον τομέα, μετρά την επίσκεψη και ανακατευθύνει.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'Ένας κωδικός QR, μια αφίσα ή οποιοσδήποτε έντυπος σύνδεσμος: παραπέμψτε στη διεύθυνση παρακάτω και προσθέστε τον δείκτη της (εδώ poster-a2) στο aliases.hosts.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Αν η ανακατεύθυνση γίνεται αλλού (στον καταχωρητή ή στον διακομιστή web), βάλτε τη να προσθέτει ?ra_via=<domain> στη διεύθυνση και ορίστε το aliases.mode σε tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Οι επισκέψεις μέσω ψευδωνύμου μετρούν και στο κανάλι τους: το ψευδώνυμο δείχνει ποια διεύθυνση χρησιμοποίησαν, το κανάλι πώς έφτασαν σε αυτήν.'

