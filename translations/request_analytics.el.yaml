# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page%: σύνδεσμος προς τη διεύθυνση %path%, που δεν υπάρχει (αιτήματα: %count%).'
'Fix or remove the link on that page.': 'Διορθώστε ή αφαιρέστε τον σύνδεσμο σε εκείνη τη σελίδα.'
'Probably %target% was meant: fix the link on that page.': 'Πιθανότατα εννοούνταν η σελίδα %target%: διορθώστε τον σύνδεσμο σε εκείνη τη σελίδα.'
'%path% does not exist, and gets %count% requests from %host%.': 'Η διεύθυνση %path% δεν υπάρχει και δέχεται %count% αιτήματα από τον ιστότοπο %host%.'
'%path% does not exist, and gets %count% requests from other sites.': 'Η διεύθυνση %path% δεν υπάρχει και δέχεται %count% αιτήματα από άλλους ιστότοπους.'
'Redirect it to the page that replaced it.': 'Ανακατευθύνετέ τη στη σελίδα που την αντικατέστησε.'
'Redirect it to %target%.': 'Ανακατευθύνετέ τη στη σελίδα %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Οι επισκέψεις με το πρόγραμμα περιήγησης %subject% ανοίγουν περίπου από τις %day% μόνο %after% σελίδες ανά επίσκεψη αντί για %before%. Τα άλλα προγράμματα περιήγησης δεν άλλαξαν.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Οι επισκέψεις από τη συσκευή %subject% ανοίγουν περίπου από τις %day% μόνο %after% σελίδες ανά επίσκεψη αντί για %before%. Οι άλλες συσκευές δεν άλλαξαν.'
'Test the site in %subject%, especially what was deployed around that day.': 'Δοκιμάστε τον ιστότοπο στο πρόγραμμα περιήγησης %subject%, κυρίως ό,τι δημοσιεύτηκε γύρω από εκείνη την ημέρα.'
'Test the site on %subject%, especially what was deployed around that day.': 'Δοκιμάστε τον ιστότοπο στη συσκευή %subject%, κυρίως ό,τι δημοσιεύτηκε γύρω από εκείνη την ημέρα.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': 'Στις %day% το Bolt δεν κατέγραψε καμία προβολή σελίδας, αλλά ήρθαν bots: πιθανότατα μια cache ή ένα CDN απαντά χωρίς το Bolt, ή η συλλογή είναι απενεργοποιημένη.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Ελέγξτε ότι τα αιτήματα σελίδων φτάνουν στο Bolt και ότι η επέκταση είναι ενεργή.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': 'Κανένα αίτημα στις %day%: ο ιστότοπος ήταν πιθανότατα εκτός λειτουργίας, ή η συγκέντρωση δεν εκτελέστηκε.'
'Check the server log of that day, and that the rollup runs.': 'Ελέγξτε το αρχείο καταγραφής του διακομιστή εκείνης της ημέρας και ότι η συγκέντρωση εκτελείται.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': 'Ο ιστότοπος %host% μετριέται ως παραπομπή (επισκέψεις: %count%): οι μεταβάσεις μεταξύ σελίδων αυτού του ιστότοπου μετριούνται πιθανότατα ως νέες επισκέψεις.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Προσθέστε τα %hosts% στη ρύθμιση %setting% της διαμόρφωσης του Request Analytics.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': 'Το %share% των επισκέψεων φτάνει χωρίς παραπέμποντα, και μια επίσκεψη ανοίγει μόνο %per_visit% σελίδες: πιθανότατα και τα κλικ μεταξύ σελίδων φτάνουν χωρίς αυτόν, οπότε το καθένα μετριέται ως νέα επίσκεψη.'
'Send the header %header%.': 'Στείλτε την κεφαλίδα %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': '%count% επισκέψεις (%share%) προέρχονται από προγράμματα περιήγησης που ζητούν πρώτα τη γλώσσα: %language%. Ο ιστότοπος δεν έχει σελίδες σε αυτή τη γλώσσα, και αυτές οι επισκέψεις ανοίγουν %per_visit% σελίδες ανά επίσκεψη έναντι %others% των υπολοίπων.'
'Translate the pages most visits start on first.': 'Μεταφράστε πρώτα τις σελίδες από τις οποίες ξεκινούν οι περισσότερες επισκέψεις.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Μεταφράστε πρώτα τις σελίδες από τις οποίες ξεκινούν οι περισσότερες επισκέψεις: %pages% (εκεί ξεκινά το %pages_share% των επισκέψεων).'
'%count% searches for %term%, and no page is about it.': '%count% αναζητήσεις για %term%, και καμία σελίδα δεν αφορά αυτό το θέμα.'
'Write one, or add the word to a page that answers it.': 'Γράψτε μία, ή προσθέστε τη λέξη σε μια σελίδα που απαντά σε αυτό.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': '%count% αναζητήσεις για %term%, ενώ η σελίδα %page% υπάρχει: πιθανότατα δύσκολα βρίσκεται.'
'Link it from the menu or the homepage.': 'Προσθέστε σύνδεσμο προς αυτήν στο μενού ή στην αρχική σελίδα.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': 'Το %visit_share% των επισκέψεων προτιμά τη γλώσσα: %language%, περισσότερο από τη γλώσσα: %default%, αλλά η προεπιλεγμένη γλώσσα του ιστότοπου είναι: %default%, και το %default_share% των προβολών σελίδων μένει σε αυτήν.'
'Make %language% the default language, or offer it on the homepage.': 'Κάντε προεπιλεγμένη τη γλώσσα %language%, ή προσφέρετέ τη στην αρχική σελίδα.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': 'Το %visit_share% των επισκέψεων προτιμά τη γλώσσα: %language%, αλλά μόνο το %view_share% των προβολών σελίδων είναι σε αυτή τη γλώσσα.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Οι επισκέψεις πιθανότατα δεν βρίσκουν τον επιλογέα γλώσσας: βάλτε τον στην κεφαλίδα, με το όνομα της γλώσσας και όχι μόνο με σημαία.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'Οι επισκέψεις βρίσκουν τον επιλογέα γλώσσας, αλλά φτάνουν σε λάθος γλώσσα: προσθέστε συνδέσμους hreflang, βάλτε τις μεταφράσεις στον χάρτη ιστότοπου και προσφέρετε τη γλώσσα %language% στις σελίδες εισόδου (ως πρόταση, ποτέ ως αναγκαστική ανακατεύθυνση).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'Οι επισκέψεις βρίσκουν τον επιλογέα γλώσσας, αλλά φτάνουν σε λάθος γλώσσα: προσθέστε συνδέσμους hreflang, βάλτε τις μεταφράσεις στον χάρτη ιστότοπου και προσφέρετε τη γλώσσα %language% στις σελίδες όπου γίνεται συχνότερα αλλαγή: %pages% (ως πρόταση, ποτέ ως αναγκαστική ανακατεύθυνση).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: %count% προβολές σελίδων σε 90 ημέρες (%share%), και το %visit_share% των επισκέψεων προτιμά αυτή τη γλώσσα.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Η ενημέρωσή της ίσως δεν αξίζει: μεταφράζετε μόνο τις βασικές σελίδες, σταματήστε να μεταφράζετε νέο περιεχόμενο ή αφαιρέστε τη γλώσσα.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% μαζί: %count% προβολές σελίδων σε 90 ημέρες (%share%), και το %visit_share% των επισκέψεων προτιμά μία από αυτές.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Η ενημέρωσή τους ίσως δεν αξίζει: μεταφράζετε μόνο τις βασικές σελίδες, σταματήστε να μεταφράζετε νέο περιεχόμενο ή αφαιρέστε κάποιες γλώσσες.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Επισκέψεις: %change% (%before% → %after%). Το κανάλι %channel% αντιστοιχεί στο %share% της απώλειας. Οι επισκέψεις ανοίγουν επίσης λιγότερες σελίδες.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Επισκέψεις: %change% (%before% → %after%). Το κανάλι %channel% αντιστοιχεί στο %share% της απώλειας.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Επισκέψεις: %change% (%before% → %after%). Το κανάλι %channel% αντιστοιχεί στο %share% της απώλειας, κυρίως %pages%. Οι επισκέψεις ανοίγουν επίσης λιγότερες σελίδες.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Επισκέψεις: %change% (%before% → %after%). Το κανάλι %channel% αντιστοιχεί στο %share% της απώλειας, κυρίως %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Ελέγξτε την κατάταξη αυτών των σελίδων στις μηχανές αναζήτησης, και αν άλλαξε ο τίτλος ή η διεύθυνσή τους.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Πιθανότατα σταμάτησε μια επαναλαμβανόμενη ανάρτηση ή καμπάνια: ελέγξτε τι δημοσιευόταν εκεί πριν.'
'Probably a linking site removed its link.': 'Πιθανότατα ένας ιστότοπος αφαίρεσε τον σύνδεσμό του.'
'Probably %source% removed its link: check the linking page.': 'Πιθανότατα ο ιστότοπος %source% αφαίρεσε τον σύνδεσμο: ελέγξτε τη σελίδα που παρέπεμπε.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Ελέγξτε τους σελιδοδείκτες και τους έντυπους συνδέσμους (αφίσες, κωδικούς QR) που οδηγούν σε αυτές τις σελίδες.'
'Setup': 'Ρύθμιση'
'Fix': 'Διόρθωση'
'Grow': 'Ανάπτυξη'
'Decide': 'Απόφαση'
'Last %days% days vs. the %days% days before': 'Τελευταίες %days% ημέρες έναντι των %days% προηγούμενων ημερών'
'Last %days% days': 'Τελευταίες %days% ημέρες'
'and %count% more': 'και %count% ακόμη'
'Details': 'Λεπτομέρειες'
'Insights': 'Ευρήματα'
'Hide': 'Απόκρυψη'
'Show': 'Εμφάνιση'
'Show all (%count%)': 'Εμφάνιση όλων (%count%)'
'Show fewer': 'Εμφάνιση λιγότερων'
'No statistics yet. Insights need %days% complete days of them and then appear here on their own.': 'Δεν υπάρχουν ακόμη στατιστικά. Τα ευρήματα χρειάζονται %days% πλήρεις ημέρες στατιστικών και μετά εμφανίζονται εδώ μόνα τους.'
'Insights need %days% complete days of statistics (so far: %count%). The first ones can appear on %day%.': 'Τα ευρήματα χρειάζονται %days% πλήρεις ημέρες στατιστικών (μέχρι τώρα: %count%). Τα πρώτα μπορεί να εμφανιστούν στις %day%.'
'Too few visits to tell a real problem from chance (last %days% days: %count%). Insights appear as the site gets more visits.': 'Πολύ λίγες επισκέψεις για να ξεχωρίσει ένα πραγματικό πρόβλημα από τη σύμπτωση (τελευταίες %days% ημέρες: %count%). Τα ευρήματα θα εμφανιστούν όταν ο ιστότοπος έχει περισσότερες επισκέψεις.'
'Nothing needs attention so far. Checks that compare longer periods start once there are %days% days of statistics, on %day%.': 'Προς το παρόν τίποτα δεν χρειάζεται προσοχή. Οι έλεγχοι που συγκρίνουν μεγαλύτερες περιόδους ξεκινούν όταν υπάρχουν %days% ημέρες στατιστικών, στις %day%.'
'Nothing needs attention. Broken links, site search, languages, visits and browsers of the last %days% days look fine.': 'Τίποτα δεν χρειάζεται προσοχή. Σπασμένοι σύνδεσμοι, αναζήτηση στον ιστότοπο, γλώσσες, επισκέψεις και περιηγητές των τελευταίων %days% ημερών είναι εντάξει.'

# Deleting statistics (administrators and developers)
'Manage statistics': 'Διαχείριση στατιστικών'
'Delete statistics': 'Διαγραφή στατιστικών'
'Delete the statistics of the last days, or all of them. Deleted statistics cannot be recovered.': 'Διαγράψτε τα στατιστικά των τελευταίων ημερών ή όλα. Τα διαγραμμένα στατιστικά δεν μπορούν να ανακτηθούν.'
'Delete statistics…': 'Διαγραφή στατιστικών…'
'Close': 'Κλείσιμο'
'Which statistics should be deleted? The period always ends now; older statistics stay as they are.': 'Ποια στατιστικά να διαγραφούν; Η περίοδος τελειώνει πάντα τώρα· τα παλαιότερα στατιστικά παραμένουν ως έχουν.'
'Period to delete': 'Περίοδος προς διαγραφή'
'Today': 'Σήμερα'
'Last 90 days': 'Τελευταίες 90 ημέρες'
'Number of days': 'Αριθμός ημερών'
'Everything': 'Όλα'
'All statistics ever collected': 'Όλα τα στατιστικά που έχουν συλλεχθεί'
'From %date%': 'Από %date%'
'Cancel': 'Ακύρωση'
'Continue': 'Συνέχεια'
'Delete permanently?': 'Οριστική διαγραφή;'
'The statistics from %date% to now will be deleted:': 'Τα στατιστικά από %date% έως τώρα θα διαγραφούν:'
'All statistics will be deleted:': 'Όλα τα στατιστικά θα διαγραφούν:'
'All statistics, collected since %date%, will be deleted:': 'Όλα τα στατιστικά, που συλλέγονται από %date%, θα διαγραφούν:'
'And everything else of these days: pages, sources, devices, languages, site searches, broken links and bots.': 'Και όλα τα υπόλοιπα αυτών των ημερών: σελίδες, πηγές, συσκευές, γλώσσες, αναζητήσεις στον ιστότοπο, σπασμένοι σύνδεσμοι και bots.'
'This cannot be undone. The statistics are erased for good; only a backup of the database can bring them back.': 'Αυτό δεν μπορεί να αναιρεθεί. Τα στατιστικά διαγράφονται οριστικά· μόνο ένα αντίγραφο ασφαλείας της βάσης δεδομένων μπορεί να τα επαναφέρει.'
'I understand that the deleted statistics cannot be recovered.': 'Κατανοώ ότι τα διαγραμμένα στατιστικά δεν μπορούν να ανακτηθούν.'
'Delete permanently': 'Οριστική διαγραφή'
'The statistics could not be counted.': 'Δεν ήταν δυνατή η καταμέτρηση των στατιστικών.'
'The statistics could not be deleted.': 'Δεν ήταν δυνατή η διαγραφή των στατιστικών.'
'All statistics were deleted.': 'Όλα τα στατιστικά διαγράφηκαν.'
'The statistics of the chosen period were deleted.': 'Τα στατιστικά της επιλεγμένης περιόδου διαγράφηκαν.'
'The statistics are being aggregated right now. Try again in a minute.': 'Τα στατιστικά συγκεντρώνονται αυτή τη στιγμή. Δοκιμάστε ξανά σε ένα λεπτό.'
