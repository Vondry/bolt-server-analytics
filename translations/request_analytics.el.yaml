'A request is a bot when its User-Agent names one, or when its headers contradict the browser it claims to be. Bots are not counted in page views, visits or any other card. AI crawlers collect pages for AI models and answer engines; robots.txt can ask them to stay away.': 'Ένα αίτημα είναι bot όταν το User-Agent το δηλώνει ή όταν οι κεφαλίδες του αντιφάσκουν με τον browser που ισχυρίζεται ότι είναι. Τα bots δεν μετρώνται στις προβολές, τις επισκέψεις ή άλλη κάρτα. Οι ανιχνευτές AI συλλέγουν σελίδες για μοντέλα AI και μηχανές απαντήσεων· το robots.txt μπορεί να τους ζητήσει να μένουν μακριά.'
