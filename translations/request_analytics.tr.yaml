# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page%, var olmayan şu adrese bağlantı veriyor: %path% (istek: %count%).'
'Fix or remove the link on that page.': 'O sayfadaki bağlantıyı düzeltin veya kaldırın.'
'Probably %target% was meant: fix the link on that page.': 'Muhtemelen kastedilen sayfa: %target%. O sayfadaki bağlantıyı düzeltin.'
'%path% does not exist, and gets %count% requests from %host%.': 'Var olmayan sayfa: %path%. Şu siteden %count% istek geliyor: %host%.'
'%path% does not exist, and gets %count% requests from other sites.': 'Var olmayan sayfa: %path%. Başka sitelerden %count% istek geliyor.'
'Redirect it to the page that replaced it.': 'Onu, yerini alan sayfaya yönlendirin.'
'Redirect it to %target%.': 'Şu sayfaya yönlendirin: %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Tarayıcı: %subject%. Ziyaretler yaklaşık şu günden beri: %day% ziyaret başına yalnızca %after% sayfa açıyor (önceden %before%). Diğer tarayıcılarda değişiklik yok.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Cihaz: %subject%. Ziyaretler yaklaşık şu günden beri: %day% ziyaret başına yalnızca %after% sayfa açıyor (önceden %before%). Diğer cihazlarda değişiklik yok.'
'Test the site in %subject%, especially what was deployed around that day.': 'Siteyi şu tarayıcıda test edin: %subject%, özellikle o gün civarında yayına alınanları.'
'Test the site on %subject%, especially what was deployed around that day.': 'Siteyi şu cihazda test edin: %subject%, özellikle o gün civarında yayına alınanları.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': 'Gün: %day%. Bolt hiç sayfa görüntüleme kaydetmedi ama botlar geldi: muhtemelen bir önbellek veya CDN Bolt olmadan yanıt veriyor ya da veri toplama kapalı.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Sayfa isteklerinin Bolt''a ulaştığını ve eklentinin etkin olduğunu kontrol edin.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': 'Gün: %day%. Hiç istek gelmedi: site muhtemelen erişilemezdi ya da toplama çalışmadı.'
'Check the server log of that day, and that the rollup runs.': 'O günün sunucu günlüğünü ve toplamanın çalıştığını kontrol edin.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': 'Yönlendiren site olarak sayılıyor: %host% (ziyaret: %count%). Bu sitenin sayfaları arasındaki geçişler muhtemelen yeni ziyaret olarak sayılıyor.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Request Analytics yapılandırmasında %setting% ayarına şunları ekleyin: %hosts%.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': 'Ziyaretlerin %share% kadarı yönlendiren olmadan geliyor ve bir ziyaret yalnızca %per_visit% sayfa açıyor: muhtemelen sayfalar arasındaki tıklamalar da yönlendiren olmadan geliyor, bu yüzden her biri yeni ziyaret sayılıyor.'
'Send the header %header%.': 'Şu başlığı gönderin: %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': '%count% ziyaret (%share%) ilk olarak şu dili isteyen tarayıcılardan geliyor: %language%. Sitede bu dilde hiç sayfa yok ve bu ziyaretler ziyaret başına %per_visit% sayfa açıyor, diğerleri %others%.'
'Translate the pages most visits start on first.': 'Önce en çok ziyaretin başladığı sayfaları çevirin.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Önce en çok ziyaretin başladığı sayfaları çevirin: %pages% (ziyaretlerin %pages_share% kadarı burada başlıyor).'
'%count% searches for %term%, and no page is about it.': 'Şu terim için %count% arama: %term%, ama hiçbir sayfa bu konuda değil.'
'Write one, or add the word to a page that answers it.': 'Bir sayfa yazın veya kelimeyi bu soruyu yanıtlayan bir sayfaya ekleyin.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': 'Şu terim için %count% arama: %term%, oysa şu sayfa var: %page%. Muhtemelen bulunması zor.'
'Link it from the menu or the homepage.': 'Menüden veya ana sayfadan ona bağlantı verin.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': 'Ziyaretlerin %visit_share% kadarı şu dili tercih ediyor: %language%; bu, şu dilden fazla: %default%. Ama sitenin varsayılan dili: %default% ve sayfa görüntülemelerin %default_share% kadarı bu dilde kalıyor.'
'Make %language% the default language, or offer it on the homepage.': 'Varsayılan dili şu yapın: %language% ya da bu dili ana sayfada önerin.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': 'Ziyaretlerin %visit_share% kadarı şu dili tercih ediyor: %language%, ama sayfa görüntülemelerin yalnızca %view_share% kadarı bu dilde.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Ziyaretler muhtemelen dil seçiciyi bulamıyor: onu başlığa, yalnızca bayrakla değil dilin adıyla koyun.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'Ziyaretler dil seçiciyi buluyor ama yanlış dile geliyor: hreflang bağlantıları ekleyin, çevirileri site haritasına koyun ve giriş sayfalarında şu dili önerin: %language% (bir öneri olarak, asla zorunlu yönlendirme olarak değil).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'Ziyaretler dil seçiciyi buluyor ama yanlış dile geliyor: hreflang bağlantıları ekleyin, çevirileri site haritasına koyun ve en çok dil değiştirilen sayfalarda şu dili önerin: %language% – %pages% (bir öneri olarak, asla zorunlu yönlendirme olarak değil).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: 90 günde %count% sayfa görüntüleme (%share%) ve ziyaretlerin %visit_share% kadarı bu dili tercih ediyor.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Güncel tutmak buna değmeyebilir: yalnızca önemli sayfaları çevirin, yeni içerikleri çevirmeyi bırakın ya da dili kaldırın.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% birlikte: 90 günde %count% sayfa görüntüleme (%share%) ve ziyaretlerin %visit_share% kadarı bunlardan birini tercih ediyor.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Bunları güncel tutmak buna değmeyebilir: yalnızca önemli sayfaları çevirin, yeni içerikleri çevirmeyi bırakın ya da bazı dilleri kaldırın.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Ziyaretler: %change% (%before% → %after%). Kanal: %channel%, kaybın %share% kadarı. Ziyaretler ayrıca daha az sayfa açıyor.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Ziyaretler: %change% (%before% → %after%). Kanal: %channel%, kaybın %share% kadarı.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Ziyaretler: %change% (%before% → %after%). Kanal: %channel%, kaybın %share% kadarı, özellikle %pages%. Ziyaretler ayrıca daha az sayfa açıyor.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Ziyaretler: %change% (%before% → %after%). Kanal: %channel%, kaybın %share% kadarı, özellikle %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Bu sayfaların arama sıralamasını ve başlıklarının ya da adreslerinin değişip değişmediğini kontrol edin.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Muhtemelen düzenli bir paylaşım veya kampanya durdu: orada daha önce neyin yayımlandığını kontrol edin.'
'Probably a linking site removed its link.': 'Muhtemelen bağlantı veren bir site bağlantısını kaldırdı.'
