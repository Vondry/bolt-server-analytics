'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'Bu sırayla: bağlantının UTM parametreleri, bir reklam ağının eklediği tıklama kimliği (gclid, fbclid, …), ziyaretçinin geldiği sayfa.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Doğrudan: yazılan bir adres, bir yer imi ya da hiçbir şey söylemeyen bir uygulama. Bilinmiyor: hiçbir ipucu yok.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Yayımladığınız bağlantılara UTM parametreleri ekleyin: utm_campaign kampanyayı, utm_source yeri, utm_medium kanal türünü adlandırır.'
'Newsletter': 'Bülten'
'Social media post': 'Sosyal medya gönderisi'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: otomatik etiketleme gclid ekler, google_ads kaynağından ücretli arama sayılır. Kampanya adlarını görmek için bunu son URL soneki olarak ekleyin:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Meta reklamları (Facebook, Instagram): fbclid otomatik eklenir, meta kaynağından sosyal medya sayılır. Kampanya adlarını görmek için bunu reklamın URL parametrelerine ekleyin:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): otomatik etiketleme utm_source=seznam ve utm_medium=cpc ekler, seznam kaynağından ücretli arama sayılır. Otomatik etiketleme olmadan sznclid de aynı şekilde sayılır.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'Kanalı utm_medium belirler: cpc, ppc veya paid → ücretli arama, bir sosyal ağdan gelirse → sosyal medya; social → sosyal medya; email veya newsletter → e-posta; display, banner veya cpm → görüntülü reklam; affiliate → ortaklık; organic → organik arama; referral → yönlendiren siteler; başka her şey → kampanya. utm_medium yoksa utm_source belirler: yapay zekâ asistanı, sosyal ağ, arama motoru veya bülten; aksi halde kampanya.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Buraya yönlendiren başka bir alan adı (eski ya da kısa olan): onu %file% içindeki aliases.hosts listesine, bu siteyi de aliases.target olarak ekleyin. Eklenti o alan adını yanıtlar, ziyareti sayar ve yönlendirir.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'Bir QR kod, bir afiş ya da basılı herhangi bir bağlantı: aşağıdaki adrese bağlantı verin ve işaretini (burada poster-a2) aliases.hosts listesine ekleyin.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Yönlendirme başka bir yerde yapılıyorsa (alan adı kayıt firmasında ya da web sunucusunda), adrese ?ra_via=<domain> eklemesini sağlayın ve aliases.mode değerini tag yapın.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Bir takma ad üzerinden gelen ziyaretler kendi kanallarında da sayılır: takma ad hangi adresi kullandıklarını, kanal ise oraya nasıl geldiklerini söyler.'

