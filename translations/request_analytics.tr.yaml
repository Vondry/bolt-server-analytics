'A request is a bot when its User-Agent names one, or when its headers contradict the browser it claims to be. Bots are not counted in page views, visits or any other card. AI crawlers collect pages for AI models and answer engines; robots.txt can ask them to stay away.': 'Bir istek, User-Agent bir bot adı verdiğinde ya da başlıkları olduğunu iddia ettiği tarayıcıyla çeliştiğinde bottur. Botlar sayfa görüntülemelerine, ziyaretlere veya başka bir karta sayılmaz. Yapay zekâ tarayıcıları yapay zekâ modelleri ve yanıt motorları için sayfa toplar; robots.txt ile uzak durmaları istenebilir.'
