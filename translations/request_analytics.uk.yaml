'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'У такому порядку: UTM-параметри посилання, ідентифікатор кліку, який додає рекламна мережа (gclid, fbclid, …), сторінка, з якої прийшов відвідувач.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Прямі заходи: введена адреса, закладка або застосунок, що нічого не повідомляє. Невідомо: жодних підказок.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Додавайте UTM-параметри до посилань, які публікуєте: utm_campaign — назва кампанії, utm_source — місце, utm_medium — вид каналу.'
'Newsletter': 'Розсилка'
'Social media post': 'Допис у соцмережах'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: автоматичне позначення додає gclid, це вважається платним пошуком із google_ads. Щоб бачити назви кампаній, додайте це як суфікс кінцевої URL-адреси:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Реклама Meta (Facebook, Instagram): fbclid додається автоматично, це вважається соцмережами з meta. Щоб бачити назви кампаній, додайте це до параметрів URL оголошення:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): автоматична розмітка додає utm_source=seznam і utm_medium=cpc, це вважається платним пошуком з seznam. Без автоматичної розмітки sznclid рахується так само.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'Канал визначає utm_medium: cpc, ppc або paid → платний пошук, із соцмережі → соцмережі; social → соцмережі; email або newsletter → ел. пошта; display, banner або cpm → медійна реклама; affiliate → партнерські мережі; organic → органічний пошук; referral → посилання з сайтів; будь-що інше → кампанія. Без utm_medium вирішує utm_source: ШІ-асистент, соцмережа, пошукова система або розсилка, інакше кампанія.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Інший домен, що веде сюди (колишній або короткий): вкажіть його в aliases.hosts у %file%, а цей сайт — як aliases.target. Розширення відповідатиме на цьому домені, зарахує візит і перенаправить.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'QR-код, плакат або будь-яке друковане посилання: ведіть на адресу нижче і додайте її мітку (тут poster-a2) до aliases.hosts.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Якщо перенаправлення відбувається деінде (у реєстратора або у вебсервері), нехай воно додає до адреси ?ra_via=<domain>, а aliases.mode встановіть у tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Візити через аліас враховуються і у своєму каналі: аліас показує, яку адресу використали, канал — як до неї потрапили.'

