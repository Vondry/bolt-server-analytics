'A request is a bot when its User-Agent names one, or when its headers contradict the browser it claims to be. Bots are not counted in page views, visits or any other card. AI crawlers collect pages for AI models and answer engines; robots.txt can ask them to stay away.': 'Запит вважається ботом, якщо його User-Agent називає бота або якщо його заголовки суперечать браузеру, за який він себе видає. Боти не враховуються в переглядах, візитах та інших картках. ШІ-краулери збирають сторінки для ШІ-моделей і систем відповідей; у robots.txt їх можна попросити не заходити.'
