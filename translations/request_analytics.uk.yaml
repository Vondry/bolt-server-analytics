# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% посилається на %path%, але такої сторінки немає (запитів: %count%).'
'Fix or remove the link on that page.': 'Виправте або видаліть посилання на цій сторінці.'
'Probably %target% was meant: fix the link on that page.': 'Імовірно, малася на увазі сторінка %target%: виправте посилання на цій сторінці.'
'%path% does not exist, and gets %count% requests from %host%.': 'Сторінки %path% немає, але на неї ведуть запити з сайту %host% (запитів: %count%).'
'%path% does not exist, and gets %count% requests from other sites.': 'Сторінки %path% немає, але на неї ведуть запити з інших сайтів (запитів: %count%).'
'Redirect it to the page that replaced it.': 'Перенаправте її на сторінку, яка її замінила.'
'Redirect it to %target%.': 'Перенаправте її на %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Візити в браузері %subject% приблизно з %day% відкривають лише %after% сторінки за візит замість %before%. В інших браузерах нічого не змінилося.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Візити (пристрій: %subject%) приблизно з %day% відкривають лише %after% сторінки за візит замість %before%. На інших пристроях нічого не змінилося.'
'Test the site in %subject%, especially what was deployed around that day.': 'Протестуйте сайт у браузері %subject%, особливо те, що викладали близько цього дня.'
'Test the site on %subject%, especially what was deployed around that day.': 'Протестуйте сайт на пристрої типу %subject%, особливо те, що викладали близько цього дня.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': '%day% Bolt не зареєстрував жодного перегляду сторінок, але боти приходили: імовірно, кеш або CDN відповідає без Bolt, або збирання даних вимкнено.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Перевірте, що запити сторінок доходять до Bolt і що розширення ввімкнено.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': '%day% не було жодного запиту: імовірно, сайт був недоступний або агрегація не запускалася.'
'Check the server log of that day, and that the rollup runs.': 'Перевірте лог сервера за цей день і те, що агрегація запускається.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': '%host% рахується як посилання з іншого сайту (візитів: %count%): імовірно, переходи між сторінками цього сайту рахуються як нові візити.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Додайте %hosts% до %setting% у конфігурації Request Analytics.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': '%share% візитів приходять без реферера, і візит відкриває лише %per_visit% сторінки: імовірно, кліки між сторінками теж приходять без нього, і кожен рахується як новий візит.'
'Send the header %header%.': 'Надсилайте заголовок %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': 'Візитів із браузерів, які першою просять мову %language%: %count% (%share%). На сайті немає сторінок цією мовою, і ці візити відкривають %per_visit% сторінки за візит проти %others% в інших.'
'Translate the pages most visits start on first.': 'Спершу перекладіть сторінки, з яких починається найбільше візитів.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Спершу перекладіть сторінки, з яких починається найбільше візитів: %pages% (з них починається %pages_share% візитів).'
'%count% searches for %term%, and no page is about it.': 'Пошуків за запитом %term%: %count%, і жодна сторінка не присвячена цьому.'
'Write one, or add the word to a page that answers it.': 'Напишіть таку сторінку або додайте це слово на сторінку, яка відповідає на питання.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': 'Пошуків за запитом %term%: %count%, хоча сторінка %page% існує: імовірно, її важко знайти.'
'Link it from the menu or the homepage.': 'Додайте посилання на неї в меню або на головну сторінку.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': '%visit_share% візитів надають перевагу мові %language%, більше, ніж мові %default%, але типова мова сайту — %default%, і в ній залишаються %default_share% переглядів сторінок.'
'Make %language% the default language, or offer it on the homepage.': 'Зробіть типовою мову %language% або запропонуйте її на головній сторінці.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': '%visit_share% візитів надають перевагу мові %language%, але цією мовою лише %view_share% переглядів сторінок.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Візити, імовірно, не знаходять перемикач мов: розмістіть його в шапці, з назвою мови, а не лише з прапором.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'Візити знаходять перемикач мов, але потрапляють не на ту мову: додайте посилання hreflang, внесіть переклади в sitemap і запропонуйте мову %language% на вхідних сторінках (як пропозицію, ніколи не як примусове перенаправлення).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'Візити знаходять перемикач мов, але потрапляють не на ту мову: додайте посилання hreflang, внесіть переклади в sitemap і запропонуйте мову %language% на сторінках, де найчастіше перемикають мову: %pages% (як пропозицію, ніколи не як примусове перенаправлення).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: переглядів сторінок за 90 днів — %count% (%share%), і цій мові надають перевагу %visit_share% візитів.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Підтримувати її в актуальному стані може бути невигідно: перекладайте лише ключові сторінки, припиніть перекладати новий вміст або видаліть мову.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% разом: переглядів сторінок за 90 днів — %count% (%share%), і одній із цих мов надають перевагу %visit_share% візитів.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Підтримувати їх в актуальному стані може бути невигідно: перекладайте лише ключові сторінки, припиніть перекладати новий вміст або видаліть деякі мови.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Візити: %change% (%before% → %after%). На канал %channel% припадає %share% втрат. Візити до того ж відкривають менше сторінок.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Візити: %change% (%before% → %after%). На канал %channel% припадає %share% втрат.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Візити: %change% (%before% → %after%). На канал %channel% припадає %share% втрат, переважно %pages%. Візити до того ж відкривають менше сторінок.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Візити: %change% (%before% → %after%). На канал %channel% припадає %share% втрат, переважно %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Перевірте позиції цих сторінок у пошуку і чи не змінилися їхній заголовок або адреса.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Імовірно, припинилася регулярна публікація або кампанія: перевірте, що там публікувалося раніше.'
'Probably a linking site removed its link.': 'Імовірно, якийсь сайт прибрав посилання.'
'Probably %source% removed its link: check the linking page.': 'Імовірно, сайт %source% прибрав посилання: перевірте сторінку, що посилалася.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Перевірте закладки й друковані посилання (плакати, QR-коди), що ведуть на ці сторінки.'
'Setup': 'Налаштування'
'Fix': 'Виправлення'
'Grow': 'Зростання'
'Decide': 'Рішення'
'Last %days% days vs. the %days% days before': 'Останні %days% днів порівняно з %days% днями перед ними'
'Last %days% days': 'Останні %days% днів'
'and %count% more': 'і ще %count%'
'Details': 'Докладніше'
'Insights': 'Висновки'
'Hide': 'Сховати'
'Show': 'Показати'
'Show all (%count%)': 'Показати всі (%count%)'
'Show fewer': 'Показати менше'
'No statistics yet. Insights need %days% complete days of them and then appear here on their own.': 'Статистики ще немає. Для висновків потрібно %days% повних днів статистики, після цього вони з’являться тут самі.'
'Insights need %days% complete days of statistics (so far: %count%). The first ones can appear on %day%.': 'Для висновків потрібно %days% повних днів статистики (поки що: %count%). Перші можуть з’явитися %day%.'
'Too few visits to tell a real problem from chance (last %days% days: %count%). Insights appear as the site gets more visits.': 'Замало візитів, щоб відрізнити справжню проблему від випадковості (останні %days% днів: %count%). Висновки з’являться, коли сайт матиме більше візитів.'
'Nothing needs attention so far. Checks that compare longer periods start once there are %days% days of statistics, on %day%.': 'Поки що ніщо не потребує уваги. Перевірки, що порівнюють довші періоди, почнуться, коли буде %days% днів статистики: %day%.'
'Nothing needs attention. Broken links, site search, languages, visits and browsers of the last %days% days look fine.': 'Ніщо не потребує уваги. Биті посилання, пошук на сайті, мови, візити й браузери за останні %days% днів у порядку.'

# Deleting statistics (administrators and developers)
'Manage statistics': 'Керування статистикою'
'Delete statistics': 'Видалити статистику'
'Delete the statistics of the last days, or all of them. Deleted statistics cannot be recovered.': 'Видаляє статистику за останні дні або всю статистику. Видалену статистику неможливо відновити.'
'Delete statistics…': 'Видалити статистику…'
'Close': 'Закрити'
'Which statistics should be deleted? The period always ends now; older statistics stay as they are.': 'Яку статистику видалити? Період завжди закінчується зараз; старіша статистика залишається без змін.'
'Period to delete': 'Період для видалення'
'Today': 'Сьогодні'
'Last 90 days': 'Останні 90 днів'
'Number of days': 'Кількість днів'
'Everything': 'Усе'
'All statistics ever collected': 'Уся зібрана статистика'
'From %date%': 'З %date%'
'Cancel': 'Скасувати'
'Continue': 'Продовжити'
'Delete permanently?': 'Видалити назавжди?'
'The statistics from %date% to now will be deleted:': 'Статистику з %date% до цього моменту буде видалено:'
'All statistics will be deleted:': 'Усю статистику буде видалено:'
'All statistics, collected since %date%, will be deleted:': 'Усю статистику, що збирається з %date%, буде видалено:'
'And everything else of these days: pages, sources, devices, languages, site searches, broken links and bots.': 'А також усе інше за ці дні: сторінки, джерела, пристрої, мови, пошук на сайті, биті посилання та боти.'
'This cannot be undone. The statistics are erased for good; only a backup of the database can bring them back.': 'Цю дію неможливо скасувати. Статистика видаляється назавжди; відновити її можна лише з резервної копії бази даних.'
'I understand that the deleted statistics cannot be recovered.': 'Я розумію, що видалену статистику неможливо відновити.'
'Delete permanently': 'Видалити назавжди'
'The statistics could not be counted.': 'Не вдалося підрахувати статистику.'
'The statistics could not be deleted.': 'Не вдалося видалити статистику.'
'All statistics were deleted.': 'Усю статистику видалено.'
'The statistics of the chosen period were deleted.': 'Статистику за вибраний період видалено.'
'The statistics are being aggregated right now. Try again in a minute.': 'Статистика зараз агрегується. Спробуйте ще раз за хвилину.'
