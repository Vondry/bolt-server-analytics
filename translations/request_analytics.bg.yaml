'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'В този ред: UTM параметрите на връзката, идентификаторът на клика, който добавя рекламна мрежа (gclid, fbclid, …), страницата, от която е дошъл посетителят.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Директно: въведен адрес, отметка или приложение, което не казва нищо. Неизвестно: никаква следа.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Добавяйте UTM параметри към връзките, които публикувате: utm_campaign именува кампанията, utm_source мястото, utm_medium вида канал.'
'Newsletter': 'Бюлетин'
'Social media post': 'Публикация в социалните мрежи'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: автоматичното маркиране добавя gclid, отчита се като платено търсене от google_ads. За да виждате имената на кампаниите, добавете това като суфикс на крайния URL адрес:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Реклами в Meta (Facebook, Instagram): fbclid се добавя автоматично, отчита се като социални мрежи от meta. За да виждате имената на кампаниите, добавете това към URL параметрите на рекламата:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): автоматичното маркиране добавя utm_source=seznam и utm_medium=cpc, отчита се като платено търсене от seznam. Без автоматично маркиране sznclid се отчита по същия начин.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'Каналът се определя от utm_medium: cpc, ppc или paid → платено търсене, от социална мрежа → социални мрежи; social → социални мрежи; email или newsletter → имейл; display, banner или cpm → дисплейна реклама; affiliate → партньорски програми; organic → органично търсене; referral → препращащи сайтове; всичко останало → кампания. Без utm_medium решава utm_source: AI асистент, социална мрежа, търсачка или бюлетин, иначе кампания.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Друг домейн, който води тук (предишен или кратък): впишете го в aliases.hosts в %file%, а този сайт като aliases.target. Разширението ще отговаря на този домейн, ще отчита посещението и ще пренасочва.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'QR код, плакат или всяка отпечатана връзка: насочете към адреса по-долу и добавете маркера му (тук poster-a2) в aliases.hosts.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Ако пренасочването става другаде (при регистратора или в уеб сървъра), нека то добавя ?ra_via=<domain> към адреса, а aliases.mode задайте на tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Посещенията през псевдоним се отчитат и в своя канал: псевдонимът показва кой адрес са използвали, каналът — как са стигнали до него.'

