'A request is a bot when its User-Agent names one, or when its headers contradict the browser it claims to be. Bots are not counted in page views, visits or any other card. AI crawlers collect pages for AI models and answer engines; robots.txt can ask them to stay away.': 'Заявката е бот, когато User-Agent го посочва или когато заглавките ѝ противоречат на браузъра, за който се представя. Ботовете не се броят в прегледите, посещенията или друга карта. AI роботите събират страници за AI модели и машини за отговори; robots.txt може да ги помоли да стоят настрана.'
