# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% сочи към %path%, а такава страница няма (заявки: %count%).'
'Fix or remove the link on that page.': 'Поправете или премахнете връзката на тази страница.'
'Probably %target% was meant: fix the link on that page.': 'Вероятно се е имала предвид страницата %target%: поправете връзката на тази страница.'
'%path% does not exist, and gets %count% requests from %host%.': 'Страницата %path% не съществува и към нея идват %count% заявки от сайта %host%.'
'%path% does not exist, and gets %count% requests from other sites.': 'Страницата %path% не съществува и към нея идват %count% заявки от други сайтове.'
'Redirect it to the page that replaced it.': 'Пренасочете я към страницата, която я е заменила.'
'Redirect it to %target%.': 'Пренасочете я към %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Посещенията с браузъра %subject% отварят приблизително от %day% само %after% страници на посещение вместо %before%. Другите браузъри са без промяна.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Посещенията от устройство %subject% отварят приблизително от %day% само %after% страници на посещение вместо %before%. Другите устройства са без промяна.'
'Test the site in %subject%, especially what was deployed around that day.': 'Тествайте сайта в браузъра %subject%, особено това, което е пуснато около този ден.'
'Test the site on %subject%, especially what was deployed around that day.': 'Тествайте сайта на устройство %subject%, особено това, което е пуснато около този ден.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': 'На %day% Bolt не е отчел нито един преглед на страница, но е имало ботове: вероятно кеш или CDN отговаря без Bolt, или събирането е изключено.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Проверете дали заявките за страници стигат до Bolt и дали разширението е включено.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': 'На %day% не е имало нито една заявка: сайтът вероятно е бил недостъпен, или обобщаването не е стартирало.'
'Check the server log of that day, and that the rollup runs.': 'Проверете лога на сървъра за този ден и дали обобщаването се изпълнява.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': '%host% се отчита като препращащ сайт (посещения: %count%): преминаванията между страниците на този сайт вероятно се броят като нови посещения.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Добавете %hosts% към %setting% в конфигурацията на Request Analytics.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': '%share% от посещенията пристигат без препращач, а едно посещение отваря само %per_visit% страници: вероятно и кликовете между страниците пристигат без него, така че всеки се брои като ново посещение.'
'Send the header %header%.': 'Изпращайте заглавката %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': '%count% посещения (%share%) идват от браузъри, които първо искат езика: %language%. Сайтът няма страници на този език, а тези посещения отварят %per_visit% страници на посещение срещу %others% при останалите.'
'Translate the pages most visits start on first.': 'Първо преведете страниците, от които започват най-много посещения.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Първо преведете страниците, от които започват най-много посещения: %pages% (от тях започват %pages_share% от посещенията).'
'%count% searches for %term%, and no page is about it.': '%count% търсения за %term%, а нито една страница не е за това.'
'Write one, or add the word to a page that answers it.': 'Напишете такава, или добавете думата към страница, която отговаря на въпроса.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': '%count% търсения за %term%, въпреки че страницата %page% съществува: вероятно е трудно да се намери.'
'Link it from the menu or the homepage.': 'Добавете връзка към нея в менюто или на началната страница.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': '%visit_share% от посещенията предпочитат езика: %language%, повече отколкото езика: %default%, но езикът по подразбиране на сайта е: %default%, и %default_share% от прегледите на страници остават на него.'
'Make %language% the default language, or offer it on the homepage.': 'Направете езика %language% език по подразбиране, или го предложете на началната страница.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': '%visit_share% от посещенията предпочитат езика: %language%, но само %view_share% от прегледите на страници са на този език.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Посещенията вероятно не намират превключвателя на езици: сложете го в заглавната част, с името на езика, а не само със знаме.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'Посещенията намират превключвателя на езици, но попадат на грешния език: добавете връзки hreflang, включете преводите в sitemap и предложете езика %language% на входните страници (като предложение, никога като принудително пренасочване).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'Посещенията намират превключвателя на езици, но попадат на грешния език: добавете връзки hreflang, включете преводите в sitemap и предложете езика %language% на страниците, където най-често се сменя езикът: %pages% (като предложение, никога като принудително пренасочване).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: %count% прегледа на страници за 90 дни (%share%), и %visit_share% от посещенията предпочитат този език.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Поддържането му актуален може да не си струва: превеждайте само ключовите страници, спрете да превеждате новото съдържание или премахнете езика.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% заедно: %count% прегледа на страници за 90 дни (%share%), и %visit_share% от посещенията предпочитат един от тях.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Поддържането им актуални може да не си струва: превеждайте само ключовите страници, спрете да превеждате новото съдържание или премахнете някои езици.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Посещения: %change% (%before% → %after%). Каналът %channel% носи %share% от загубата. Посещенията освен това отварят по-малко страници.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Посещения: %change% (%before% → %after%). Каналът %channel% носи %share% от загубата.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Посещения: %change% (%before% → %after%). Каналът %channel% носи %share% от загубата, най-вече %pages%. Посещенията освен това отварят по-малко страници.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Посещения: %change% (%before% → %after%). Каналът %channel% носи %share% от загубата, най-вече %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Проверете позициите на тези страници в търсачките и дали заглавието или адресът им са се променили.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Вероятно е спряла редовна публикация или кампания: проверете какво се е публикувало там преди.'
'Probably a linking site removed its link.': 'Вероятно някой сайт е премахнал връзката си.'
'Probably %source% removed its link: check the linking page.': 'Вероятно сайтът %source% е премахнал връзката: проверете страницата, която е сочела насам.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Проверете отметките и отпечатаните връзки (плакати, QR кодове), които водят към тези страници.'
'Setup': 'Настройка'
'Fix': 'Поправка'
'Grow': 'Растеж'
'Decide': 'Решение'
'Last %days% days vs. the %days% days before': 'Последните %days% дни спрямо предходните %days% дни'
'Last %days% days': 'Последните %days% дни'
'and %count% more': 'и още %count%'
'Details': 'Подробности'
'Insights': 'Изводи'
'Hide': 'Скрий'
'Show': 'Покажи'
'Show all (%count%)': 'Покажи всички (%count%)'
'Show fewer': 'Покажи по-малко'
'No statistics yet. Insights need %days% complete days of them and then appear here on their own.': 'Все още няма статистика. Изводите изискват %days% пълни дни статистика и след това се появяват тук сами.'
'Insights need %days% complete days of statistics (so far: %count%). The first ones can appear on %day%.': 'Изводите изискват %days% пълни дни статистика (досега: %count%). Първите може да се появят на %day%.'
'Too few visits to tell a real problem from chance (last %days% days: %count%). Insights appear as the site gets more visits.': 'Твърде малко посещения, за да се различи истински проблем от случайност (последните %days% дни: %count%). Изводите ще се появят, когато сайтът има повече посещения.'
'Nothing needs attention so far. Checks that compare longer periods start once there are %days% days of statistics, on %day%.': 'Засега нищо не изисква внимание. Проверките, които сравняват по-дълги периоди, започват, когато има %days% дни статистика, на %day%.'
'Nothing needs attention. Broken links, site search, languages, visits and browsers of the last %days% days look fine.': 'Нищо не изисква внимание. Счупени връзки, търсене в сайта, езици, посещения и браузъри за последните %days% дни са наред.'

# Deleting statistics (administrators and developers)
'Manage statistics': 'Управление на статистиката'
'Delete statistics': 'Изтриване на статистика'
'Delete the statistics of the last days, or all of them. Deleted statistics cannot be recovered.': 'Изтрийте статистиката за последните дни или цялата. Изтритата статистика не може да бъде възстановена.'
'Delete statistics…': 'Изтриване на статистика…'
'Close': 'Затвори'
'Which statistics should be deleted? The period always ends now; older statistics stay as they are.': 'Коя статистика да бъде изтрита? Периодът винаги завършва сега; по-старата статистика остава непроменена.'
'Period to delete': 'Период за изтриване'
'Today': 'Днес'
'Last 90 days': 'Последните 90 дни'
'Number of days': 'Брой дни'
'Everything': 'Всичко'
'All statistics ever collected': 'Цялата събрана статистика'
'From %date%': 'От %date%'
'Cancel': 'Отказ'
'Continue': 'Продължи'
'Delete permanently?': 'Окончателно изтриване?'
'The statistics from %date% to now will be deleted:': 'Статистиката от %date% до сега ще бъде изтрита:'
'All statistics will be deleted:': 'Цялата статистика ще бъде изтрита:'
'All statistics, collected since %date%, will be deleted:': 'Цялата статистика, събирана от %date%, ще бъде изтрита:'
'And everything else of these days: pages, sources, devices, languages, site searches, broken links and bots.': 'И всичко останало за тези дни: страници, източници, устройства, езици, търсения в сайта, счупени връзки и ботове.'
'This cannot be undone. The statistics are erased for good; only a backup of the database can bring them back.': 'Това действие е необратимо. Статистиката се изтрива завинаги; само резервно копие на базата данни може да я възстанови.'
'I understand that the deleted statistics cannot be recovered.': 'Разбирам, че изтритата статистика не може да бъде възстановена.'
'Delete permanently': 'Изтрий окончателно'
'The statistics could not be counted.': 'Статистиката не можа да бъде преброена.'
'The statistics could not be deleted.': 'Статистиката не можа да бъде изтрита.'
'All statistics were deleted.': 'Цялата статистика беше изтрита.'
'The statistics of the chosen period were deleted.': 'Статистиката за избрания период беше изтрита.'
'The statistics are being aggregated right now. Try again in a minute.': 'В момента статистиката се обобщава. Опитайте отново след минута.'
