# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% rimanda a %path%, che non esiste (richieste: %count%).'
'Fix or remove the link on that page.': 'Correggi o rimuovi il link in quella pagina.'
'Probably %target% was meant: fix the link on that page.': 'Probabilmente si intendeva %target%: correggi il link in quella pagina.'
'%path% does not exist, and gets %count% requests from %host%.': '%path% non esiste e riceve %count% richieste da %host%.'
'%path% does not exist, and gets %count% requests from other sites.': '%path% non esiste e riceve %count% richieste da altri siti.'
'Redirect it to the page that replaced it.': 'Reindirizzala alla pagina che l’ha sostituita.'
'Redirect it to %target%.': 'Reindirizzala a %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Le visite con %subject% aprono da circa il %day% solo %after% pagine per visita invece di %before%. Gli altri browser sono invariati.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Le visite sul dispositivo %subject% aprono da circa il %day% solo %after% pagine per visita invece di %before%. Gli altri dispositivi sono invariati.'
'Test the site in %subject%, especially what was deployed around that day.': 'Prova il sito in %subject%, soprattutto ciò che è stato pubblicato intorno a quel giorno.'
'Test the site on %subject%, especially what was deployed around that day.': 'Prova il sito sul dispositivo %subject%, soprattutto ciò che è stato pubblicato intorno a quel giorno.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': 'Il %day% Bolt non ha registrato visualizzazioni di pagina, ma sono arrivati dei bot: probabilmente una cache o una CDN risponde senza Bolt, oppure la raccolta è disattivata.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Verifica che le richieste delle pagine raggiungano Bolt e che l’estensione sia attiva.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': 'Nessuna richiesta il %day%: probabilmente il sito non era raggiungibile, oppure l’aggregazione non è stata eseguita.'
'Check the server log of that day, and that the rollup runs.': 'Controlla il log del server di quel giorno e che l’aggregazione venga eseguita.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': '%host% viene contato come sito referente (visite: %count%): i passaggi tra le pagine di questo sito probabilmente contano come nuove visite.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Aggiungi %hosts% a %setting% nella configurazione di Request Analytics.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': 'Il %share% delle visite arriva senza referrer, e una visita apre solo %per_visit% pagine: probabilmente anche i clic tra le pagine arrivano senza, quindi ognuno conta come una nuova visita.'
'Send the header %header%.': 'Invia l’intestazione %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': '%count% visite (%share%) provengono da browser che chiedono prima la lingua: %language%. Il sito non ha pagine in questa lingua, e queste visite aprono %per_visit% pagine per visita contro %others% delle altre.'
'Translate the pages most visits start on first.': 'Traduci prima le pagine da cui iniziano più visite.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Traduci prima le pagine da cui iniziano più visite: %pages% (da lì inizia il %pages_share% delle visite).'
'%count% searches for %term%, and no page is about it.': '%count% ricerche di %term%, e nessuna pagina ne parla.'
'Write one, or add the word to a page that answers it.': 'Scrivine una, oppure aggiungi la parola a una pagina che risponde.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': '%count% ricerche di %term%, eppure %page% esiste: probabilmente è difficile da trovare.'
'Link it from the menu or the homepage.': 'Aggiungi un link nel menu o nella home page.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': 'Il %visit_share% delle visite preferisce la lingua: %language%, più della lingua: %default%, ma la lingua predefinita del sito è: %default%, e il %default_share% delle visualizzazioni di pagina resta in essa.'
'Make %language% the default language, or offer it on the homepage.': 'Imposta la lingua %language% come predefinita, oppure offrila nella home page.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': 'Il %visit_share% delle visite preferisce la lingua: %language%, ma solo il %view_share% delle visualizzazioni di pagina è in questa lingua.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Probabilmente le visite non trovano il selettore della lingua: mettilo nell’intestazione, con il nome della lingua e non solo una bandiera.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'Le visite trovano il selettore della lingua, ma arrivano nella lingua sbagliata: aggiungi i link hreflang, inserisci le traduzioni nella sitemap e offri la lingua %language% nelle pagine di ingresso (come suggerimento, mai come reindirizzamento forzato).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'Le visite trovano il selettore della lingua, ma arrivano nella lingua sbagliata: aggiungi i link hreflang, inserisci le traduzioni nella sitemap e offri la lingua %language% nelle pagine in cui si cambia lingua più spesso: %pages% (come suggerimento, mai come reindirizzamento forzato).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: %count% visualizzazioni di pagina in 90 giorni (%share%), e il %visit_share% delle visite preferisce questa lingua.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Tenerla aggiornata potrebbe non valerne la pena: traduci solo le pagine principali, smetti di tradurre i nuovi contenuti, oppure rimuovi la lingua.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% insieme: %count% visualizzazioni di pagina in 90 giorni (%share%), e il %visit_share% delle visite preferisce una di esse.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Tenerle aggiornate potrebbe non valerne la pena: traduci solo le pagine principali, smetti di tradurre i nuovi contenuti, oppure rimuovi alcune lingue.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Visite: %change% (%before% → %after%). Il canale %channel% rappresenta il %share% del calo. Le visite aprono anche meno pagine.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Visite: %change% (%before% → %after%). Il canale %channel% rappresenta il %share% del calo.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Visite: %change% (%before% → %after%). Il canale %channel% rappresenta il %share% del calo, soprattutto %pages%. Le visite aprono anche meno pagine.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Visite: %change% (%before% → %after%). Il canale %channel% rappresenta il %share% del calo, soprattutto %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Controlla il posizionamento di queste pagine nei motori di ricerca, e se il loro titolo o indirizzo è cambiato.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Probabilmente si è fermato un post o una campagna ricorrente: controlla cosa vi veniva pubblicato prima.'
'Probably a linking site removed its link.': 'Probabilmente un sito referente ha rimosso il suo link.'
'Probably %source% removed its link: check the linking page.': 'Probabilmente %source% ha rimosso il suo link: controlla la pagina che lo conteneva.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Controlla i segnalibri e i link stampati (manifesti, codici QR) che portano a queste pagine.'
