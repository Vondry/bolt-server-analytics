'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'In questo ordine: i parametri UTM del link, il click ID aggiunto da una rete pubblicitaria (gclid, fbclid, …), la pagina da cui arriva il visitatore.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Diretto: un indirizzo digitato, un segnalibro o un''app che non dice nulla. Sconosciuto: nessun indizio.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Aggiungete parametri UTM ai link che pubblicate: utm_campaign dà il nome alla campagna, utm_source il luogo, utm_medium il tipo di canale.'
'Newsletter': 'Newsletter'
'Social media post': 'Post sui social'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: il tagging automatico aggiunge gclid, conteggiato come ricerca a pagamento da google_ads. Per vedere i nomi delle campagne, aggiungete questo come suffisso dell''URL finale:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Annunci Meta (Facebook, Instagram): fbclid viene aggiunto automaticamente, conteggiato come social da meta. Per vedere i nomi delle campagne, aggiungete questo ai parametri URL dell''annuncio:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): il tagging automatico aggiunge utm_source=seznam e utm_medium=cpc, conteggiato come ricerca a pagamento da seznam. Senza tagging automatico, sznclid viene conteggiato allo stesso modo.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'utm_medium decide il canale: cpc, ppc o paid → ricerca a pagamento, da un social network → social; social → social; email o newsletter → email; display, banner o cpm → display; affiliate → affiliazione; organic → ricerca organica; referral → siti referenti; qualsiasi altro → campagna. Senza utm_medium decide utm_source: un assistente IA, un social network, un motore di ricerca o una newsletter, altrimenti campagna.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Un altro dominio che porta qui (uno precedente o uno breve): inseritelo in aliases.hosts di %file%, con questo sito come aliases.target. L''estensione risponde a quel dominio, conta la visita e reindirizza.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'Un codice QR, un manifesto o qualsiasi link stampato: puntate all''indirizzo qui sotto e aggiungete il suo marcatore (qui poster-a2) ad aliases.hosts.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Se il reindirizzamento avviene altrove (presso il registrar o nel server web), fategli aggiungere ?ra_via=<domain> all''indirizzo e impostate aliases.mode su tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Le visite tramite un alias contano anche nel loro canale: l''alias dice quale indirizzo hanno usato, il canale come ci sono arrivati.'

