'Delete statistics…': 'Statistieken verwijderen…'
'Close': 'Sluiten'
'Which statistics should be deleted? The period always ends now; older statistics stay as they are.': 'Welke statistieken moeten worden verwijderd? De periode eindigt altijd nu; oudere statistieken blijven ongewijzigd.'
'Period to delete': 'Te verwijderen periode'
'Today': 'Vandaag'
'Last 90 days': 'Laatste 90 dagen'
'Number of days': 'Aantal dagen'
'Everything': 'Alles'
'All statistics ever collected': 'Alle ooit verzamelde statistieken'
'From %date%': 'Vanaf %date%'
'Cancel': 'Annuleren'
'Continue': 'Doorgaan'
'Delete permanently?': 'Definitief verwijderen?'
'The statistics from %date% to now will be deleted:': 'De statistieken van %date% tot nu worden verwijderd:'
'All statistics will be deleted:': 'Alle statistieken worden verwijderd:'
'All statistics, collected since %date%, will be deleted:': 'Alle statistieken, verzameld sinds %date%, worden verwijderd:'
'And everything else of these days: pages, sources, devices, languages, site searches, broken links and bots.': 'En al het andere van deze dagen: pagina’s, bronnen, apparaten, talen, zoekopdrachten op de site, kapotte links en bots.'
'This cannot be undone. The statistics are erased for good; only a backup of the database can bring them back.': 'Dit kan niet ongedaan worden gemaakt. De statistieken worden definitief gewist; alleen een back-up van de database kan ze terugzetten.'
'I understand that the deleted statistics cannot be recovered.': 'Ik begrijp dat de verwijderde statistieken niet kunnen worden hersteld.'
'Delete permanently': 'Definitief verwijderen'
'The statistics could not be counted.': 'De statistieken konden niet worden geteld.'
'The statistics could not be deleted.': 'De statistieken konden niet worden verwijderd.'
'All statistics were deleted.': 'Alle statistieken zijn verwijderd.'
'The statistics of the chosen period were deleted.': 'De statistieken van de gekozen periode zijn verwijderd.'
'The statistics are being aggregated right now. Try again in a minute.': 'De statistieken worden op dit moment samengevoegd. Probeer het over een minuut opnieuw.'
