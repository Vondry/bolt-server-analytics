'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'In deze volgorde: de UTM-parameters van de link, de klik-ID die een advertentienetwerk toevoegt (gclid, fbclid, …), de pagina waar de bezoeker vandaan kwam.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Direct: een getypt adres, een bladwijzer of een app die niets vertelt. Onbekend: geen enkele aanwijzing.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Voeg UTM-parameters toe aan de links die u publiceert: utm_campaign geeft de campagne een naam, utm_source de plek, utm_medium het soort kanaal.'
'Newsletter': 'Nieuwsbrief'
'Social media post': 'Bericht op sociale media'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: automatische tagging voegt gclid toe, geteld als betaald zoeken van google_ads. Voeg dit toe als achtervoegsel van de uiteindelijke URL om campagnenamen te zien:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Meta-advertenties (Facebook, Instagram): fbclid wordt automatisch toegevoegd, geteld als sociale media van meta. Voeg dit toe aan de URL-parameters van de advertentie om campagnenamen te zien:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): automatische tagging voegt utm_source=seznam en utm_medium=cpc toe, geteld als betaald zoeken van seznam. Zonder automatische tagging wordt sznclid op dezelfde manier geteld.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'utm_medium bepaalt het kanaal: cpc, ppc of paid → betaald zoeken, vanaf een sociaal netwerk → sociale media; social → sociale media; email of newsletter → e-mail; display, banner of cpm → display; affiliate → affiliate; organic → organisch zoeken; referral → verwijzingen; al het andere → campagne. Zonder utm_medium beslist utm_source: een AI-assistent, een sociaal netwerk, een zoekmachine of een nieuwsbrief, anders campagne.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Een ander domein dat hierheen leidt (een vorig of een kort domein): zet het in aliases.hosts van %file%, met deze site als aliases.target. De extensie beantwoordt dat domein dan, telt het bezoek en stuurt door.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'Een QR-code, een poster of een gedrukte link: verwijs naar het adres hieronder en zet de markering (hier poster-a2) in aliases.hosts.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Gebeurt de doorverwijzing ergens anders (bij de registrar of in de webserver), laat die dan ?ra_via=<domain> aan het adres toevoegen en zet aliases.mode op tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Bezoeken via een alias tellen ook mee in hun kanaal: de alias vertelt welk adres ze gebruikten, het kanaal hoe ze daar kwamen.'

