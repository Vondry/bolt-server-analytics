# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% linkt naar %path%, die niet bestaat (verzoeken: %count%).'
'Fix or remove the link on that page.': 'Herstel of verwijder de link op die pagina.'
'Probably %target% was meant: fix the link on that page.': 'Waarschijnlijk was %target% bedoeld: herstel de link op die pagina.'
'%path% does not exist, and gets %count% requests from %host%.': '%path% bestaat niet en krijgt %count% verzoeken van %host%.'
'%path% does not exist, and gets %count% requests from other sites.': '%path% bestaat niet en krijgt %count% verzoeken van andere sites.'
'Redirect it to the page that replaced it.': 'Stuur haar door naar de pagina die haar verving.'
'Redirect it to %target%.': 'Stuur haar door naar %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Bezoeken met %subject% openen sinds ongeveer %day% nog maar %after% pagina''s per bezoek in plaats van %before%. Andere browsers zijn ongewijzigd.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Bezoeken op het apparaat %subject% openen sinds ongeveer %day% nog maar %after% pagina''s per bezoek in plaats van %before%. Andere apparaten zijn ongewijzigd.'
'Test the site in %subject%, especially what was deployed around that day.': 'Test de site in %subject%, vooral wat rond die dag is uitgerold.'
'Test the site on %subject%, especially what was deployed around that day.': 'Test de site op het apparaat %subject%, vooral wat rond die dag is uitgerold.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': 'Op %day% registreerde Bolt geen paginaweergaven, maar er kwamen wel bots: waarschijnlijk antwoordt een cache of CDN zonder Bolt, of staat het verzamelen uit.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Controleer of paginaverzoeken Bolt bereiken en of de extensie is ingeschakeld.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': 'Helemaal geen verzoeken op %day%: de site lag waarschijnlijk plat, of de aggregatie is niet gedraaid.'
'Check the server log of that day, and that the rollup runs.': 'Controleer het serverlog van die dag, en of de aggregatie draait.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': '%host% wordt als verwijzing geteld (bezoeken: %count%): overgangen tussen pagina''s van deze site tellen waarschijnlijk als nieuwe bezoeken.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Voeg %hosts% toe aan %setting% in de configuratie van Request Analytics.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': '%share% van de bezoeken komt binnen zonder referrer, en een bezoek opent maar %per_visit% pagina''s: waarschijnlijk komen ook klikken tussen pagina''s zonder referrer binnen, zodat elke klik als nieuw bezoek telt.'
'Send the header %header%.': 'Stuur de header %header% mee.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': '%count% bezoeken (%share%) komen van browsers die eerst om de taal %language% vragen. De site heeft geen pagina''s in die taal, en deze bezoeken openen %per_visit% pagina''s per bezoek tegenover %others% bij de andere.'
'Translate the pages most visits start on first.': 'Vertaal eerst de pagina''s waarop de meeste bezoeken beginnen.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Vertaal eerst de pagina''s waarop de meeste bezoeken beginnen: %pages% (daar begint %pages_share% van de bezoeken).'
'%count% searches for %term%, and no page is about it.': '%count% zoekopdrachten naar %term%, en geen enkele pagina gaat erover.'
'Write one, or add the word to a page that answers it.': 'Schrijf er een, of voeg het woord toe aan een pagina die het antwoord geeft.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': '%count% zoekopdrachten naar %term%, terwijl %page% bestaat: die is waarschijnlijk moeilijk te vinden.'
'Link it from the menu or the homepage.': 'Link ernaar vanuit het menu of de startpagina.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': '%visit_share% van de bezoeken geeft de voorkeur aan de taal %language%, meer dan aan de taal %default%, maar de standaardtaal van de site is %default%, en %default_share% van de paginaweergaven blijft in die taal.'
'Make %language% the default language, or offer it on the homepage.': 'Maak %language% de standaardtaal, of bied de taal aan op de startpagina.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': '%visit_share% van de bezoeken geeft de voorkeur aan de taal %language%, maar slechts %view_share% van de paginaweergaven is in die taal.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Bezoeken vinden de taalkeuze waarschijnlijk niet: zet die in de header, met de naam van de taal en niet alleen een vlag.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'Bezoeken vinden de taalkeuze, maar komen in de verkeerde taal terecht: voeg hreflang-links toe, zet de vertalingen in de sitemap en bied de taal %language% aan op de instappagina''s (als suggestie, nooit als gedwongen doorverwijzing).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'Bezoeken vinden de taalkeuze, maar komen in de verkeerde taal terecht: voeg hreflang-links toe, zet de vertalingen in de sitemap en bied de taal %language% aan op de pagina''s waar het vaakst van taal wordt gewisseld: %pages% (als suggestie, nooit als gedwongen doorverwijzing).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: %count% paginaweergaven in 90 dagen (%share%), en %visit_share% van de bezoeken geeft de voorkeur aan deze taal.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Haar bijhouden loont misschien niet: vertaal alleen de belangrijkste pagina''s, stop met het vertalen van nieuwe inhoud, of verwijder de taal.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% samen: %count% paginaweergaven in 90 dagen (%share%), en %visit_share% van de bezoeken geeft de voorkeur aan een ervan.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Ze bijhouden loont misschien niet: vertaal alleen de belangrijkste pagina''s, stop met het vertalen van nieuwe inhoud, of verwijder enkele talen.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Bezoeken: %change% (%before% → %after%). Het kanaal %channel% is goed voor %share% van het verlies. Bezoeken openen ook minder pagina''s.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Bezoeken: %change% (%before% → %after%). Het kanaal %channel% is goed voor %share% van het verlies.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Bezoeken: %change% (%before% → %after%). Het kanaal %channel% is goed voor %share% van het verlies, vooral %pages%. Bezoeken openen ook minder pagina''s.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Bezoeken: %change% (%before% → %after%). Het kanaal %channel% is goed voor %share% van het verlies, vooral %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Controleer de positie van deze pagina''s in zoekmachines, en of hun titel of adres is gewijzigd.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Waarschijnlijk is een terugkerend bericht of een campagne gestopt: controleer wat daar eerder werd gepubliceerd.'
'Probably a linking site removed its link.': 'Waarschijnlijk heeft een verwijzende site haar link verwijderd.'
'Probably %source% removed its link: check the linking page.': 'Waarschijnlijk heeft %source% de link verwijderd: controleer de verwijzende pagina.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Controleer bladwijzers en gedrukte links (posters, QR-codes) die naar deze pagina''s leiden.'
