'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'Nesta ordem: os parâmetros UTM do link, o ID de clique que uma rede de anúncios adiciona (gclid, fbclid, …), a página de onde o visitante veio.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Direto: um endereço digitado, um favorito ou um app que não diz nada. Desconhecido: nenhuma pista.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Adicione parâmetros UTM aos links que você publica: utm_campaign dá nome à campanha, utm_source o lugar, utm_medium o tipo de canal.'
'Newsletter': 'Newsletter'
'Social media post': 'Post em redes sociais'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: a marcação automática adiciona gclid, contado como busca paga de google_ads. Para ver os nomes das campanhas, adicione isto como sufixo do URL final:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Anúncios da Meta (Facebook, Instagram): fbclid é adicionado automaticamente, contado como redes sociais de meta. Para ver os nomes das campanhas, adicione isto aos parâmetros de URL do anúncio:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): a marcação automática adiciona utm_source=seznam e utm_medium=cpc, contado como busca paga de seznam. Sem marcação automática, sznclid é contado da mesma forma.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'utm_medium decide o canal: cpc, ppc ou paid → busca paga, vindo de uma rede social → redes sociais; social → redes sociais; email ou newsletter → e-mail; display, banner ou cpm → display; affiliate → afiliados; organic → busca orgânica; referral → referências; qualquer outro → campanha. Sem utm_medium, quem decide é o utm_source: um assistente de IA, uma rede social, um buscador ou uma newsletter; caso contrário, campanha.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Outro domínio que leva até aqui (um antigo ou um curto): coloque-o em aliases.hosts de %file%, com este site como aliases.target. A extensão responde a esse domínio, conta a visita e redireciona.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'Um QR code, um cartaz ou qualquer link impresso: aponte para o endereço abaixo e adicione o marcador dele (aqui poster-a2) a aliases.hosts.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Se o redirecionamento acontece em outro lugar (no registrador ou no servidor web), faça com que ele adicione ?ra_via=<domain> ao endereço e defina aliases.mode como tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'As visitas por um alias também contam no seu canal: o alias diz qual endereço usaram, o canal como chegaram até ele.'

