'All statistics will be deleted:': 'Toutes les statistiques seront supprimées :'
'All statistics, collected since %date%, will be deleted:': 'Toutes les statistiques, collectées depuis le %date%, seront supprimées :'
'And everything else of these days: pages, sources, devices, languages, site searches, broken links and bots.': 'Et tout le reste de ces jours : pages, sources, appareils, langues, recherches sur le site, liens brisés et robots.'
'This cannot be undone. The statistics are erased for good; only a backup of the database can bring them back.': 'Cette action est irréversible. Les statistiques sont effacées définitivement ; seule une sauvegarde de la base de données peut les restaurer.'
'I understand that the deleted statistics cannot be recovered.': 'Je comprends que les statistiques supprimées ne peuvent pas être récupérées.'
'Delete permanently': 'Supprimer définitivement'
'The statistics could not be counted.': 'Les statistiques n’ont pas pu être comptées.'
'The statistics could not be deleted.': 'Les statistiques n’ont pas pu être supprimées.'
'All statistics were deleted.': 'Toutes les statistiques ont été supprimées.'
'The statistics of the chosen period were deleted.': 'Les statistiques de la période choisie ont été supprimées.'
'The statistics are being aggregated right now. Try again in a minute.': 'Les statistiques sont en cours d’agrégation. Réessayez dans une minute.'
