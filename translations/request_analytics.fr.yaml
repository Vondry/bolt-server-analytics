# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% renvoie vers %path%, qui n’existe pas (requêtes : %count%).'
'Fix or remove the link on that page.': 'Corrigez ou supprimez le lien sur cette page.'
'Probably %target% was meant: fix the link on that page.': 'Il s’agissait probablement de %target% : corrigez le lien sur cette page.'
'%path% does not exist, and gets %count% requests from %host%.': '%path% n’existe pas et reçoit %count% requêtes depuis %host%.'
'%path% does not exist, and gets %count% requests from other sites.': '%path% n’existe pas et reçoit %count% requêtes depuis d’autres sites.'
'Redirect it to the page that replaced it.': 'Redirigez-la vers la page qui l’a remplacée.'
'Redirect it to %target%.': 'Redirigez-la vers %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Les visites avec %subject% ouvrent depuis environ le %day% seulement %after% pages par visite au lieu de %before%. Les autres navigateurs sont inchangés.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Les visites sur l’appareil %subject% ouvrent depuis environ le %day% seulement %after% pages par visite au lieu de %before%. Les autres appareils sont inchangés.'
'Test the site in %subject%, especially what was deployed around that day.': 'Testez le site dans %subject%, surtout ce qui a été déployé autour de ce jour.'
'Test the site on %subject%, especially what was deployed around that day.': 'Testez le site sur l’appareil %subject%, surtout ce qui a été déployé autour de ce jour.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': 'Le %day%, Bolt n’a enregistré aucune page vue, mais des bots sont venus : un cache ou un CDN répond probablement sans Bolt, ou la collecte est désactivée.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Vérifiez que les requêtes de pages atteignent Bolt et que l’extension est activée.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': 'Aucune requête le %day% : le site était probablement hors ligne, ou l’agrégation ne s’est pas exécutée.'
'Check the server log of that day, and that the rollup runs.': 'Vérifiez le journal du serveur de ce jour-là, et que l’agrégation s’exécute.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': '%host% est compté comme site référent (visites : %count%) : les passages entre les pages de ce site comptent probablement comme de nouvelles visites.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Ajoutez %hosts% à %setting% dans la configuration de Request Analytics.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': '%share% des visites arrivent sans référent, et une visite n’ouvre que %per_visit% pages : les clics entre les pages arrivent probablement sans référent eux aussi, et chacun compte comme une nouvelle visite.'
'Send the header %header%.': 'Envoyez l’en-tête %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': '%count% visites (%share%) viennent de navigateurs qui demandent d’abord la langue : %language%. Le site n’a aucune page dans cette langue, et ces visites ouvrent %per_visit% pages par visite contre %others% pour les autres.'
'Translate the pages most visits start on first.': 'Traduisez d’abord les pages où commencent le plus de visites.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Traduisez d’abord les pages où commencent le plus de visites : %pages% (%pages_share% des visites y commencent).'
'%count% searches for %term%, and no page is about it.': '%count% recherches de %term%, et aucune page n’en parle.'
'Write one, or add the word to a page that answers it.': 'Écrivez-en une, ou ajoutez le mot à une page qui y répond.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': '%count% recherches de %term%, alors que %page% existe : elle est probablement difficile à trouver.'
'Link it from the menu or the homepage.': 'Ajoutez un lien vers elle dans le menu ou sur la page d’accueil.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': '%visit_share% des visites préfèrent la langue : %language%, plus que la langue : %default%, mais la langue par défaut du site est : %default%, et %default_share% des pages vues y restent.'
'Make %language% the default language, or offer it on the homepage.': 'Faites de la langue %language% la langue par défaut, ou proposez-la sur la page d’accueil.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': '%visit_share% des visites préfèrent la langue : %language%, mais seules %view_share% des pages vues sont dans cette langue.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Les visites ne trouvent probablement pas le sélecteur de langue : placez-le dans l’en-tête, avec le nom de la langue et pas seulement un drapeau.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'Les visites trouvent le sélecteur de langue, mais arrivent dans la mauvaise langue : ajoutez des liens hreflang, mettez les traductions dans le sitemap et proposez la langue %language% sur les pages d’entrée (une suggestion, jamais une redirection forcée).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'Les visites trouvent le sélecteur de langue, mais arrivent dans la mauvaise langue : ajoutez des liens hreflang, mettez les traductions dans le sitemap et proposez la langue %language% sur les pages où l’on change le plus de langue : %pages% (une suggestion, jamais une redirection forcée).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language% : %count% pages vues en 90 jours (%share%), et %visit_share% des visites préfèrent cette langue.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'La tenir à jour n’en vaut peut-être pas la peine : ne traduisez que les pages clés, arrêtez de traduire les nouveaux contenus, ou supprimez la langue.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% ensemble : %count% pages vues en 90 jours (%share%), et %visit_share% des visites préfèrent l’une d’elles.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Les tenir à jour n’en vaut peut-être pas la peine : ne traduisez que les pages clés, arrêtez de traduire les nouveaux contenus, ou supprimez certaines langues.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Visites : %change% (%before% → %after%). Le canal %channel% représente %share% de la baisse. Les visites ouvrent aussi moins de pages.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Visites : %change% (%before% → %after%). Le canal %channel% représente %share% de la baisse.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Visites : %change% (%before% → %after%). Le canal %channel% représente %share% de la baisse, surtout %pages%. Les visites ouvrent aussi moins de pages.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Visites : %change% (%before% → %after%). Le canal %channel% représente %share% de la baisse, surtout %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Vérifiez le classement de ces pages dans les moteurs de recherche, et si leur titre ou leur adresse a changé.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Une publication ou une campagne récurrente s’est probablement arrêtée : vérifiez ce qui y était publié auparavant.'
'Probably a linking site removed its link.': 'Un site référent a probablement retiré son lien.'
'Probably %source% removed its link: check the linking page.': '%source% a probablement retiré son lien : vérifiez la page qui faisait le lien.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Vérifiez les favoris et les liens imprimés (affiches, codes QR) qui mènent à ces pages.'
