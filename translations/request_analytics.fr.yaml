'A request is a bot when its User-Agent names one, or when its headers contradict the browser it claims to be. Bots are not counted in page views, visits or any other card. AI crawlers collect pages for AI models and answer engines; robots.txt can ask them to stay away.': 'Une requête est un robot quand son User-Agent en nomme un, ou quand ses en-têtes contredisent le navigateur qu’elle prétend être. Les robots ne comptent ni dans les pages vues, ni dans les visites, ni dans aucune autre carte. Les robots d’IA collectent des pages pour des modèles d’IA et des moteurs de réponses ; robots.txt peut leur demander de s’abstenir.'
