'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'Dans cet ordre : les paramètres UTM du lien, l''identifiant de clic ajouté par une régie (gclid, fbclid, …), la page d''où vient le visiteur.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Direct : une adresse saisie, un favori ou une application qui ne dit rien. Inconnu : aucun indice.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Ajoutez des paramètres UTM aux liens que vous publiez : utm_campaign nomme la campagne, utm_source le lieu, utm_medium le type de canal.'
'Newsletter': 'Newsletter'
'Social media post': 'Publication sur les réseaux sociaux'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads : le marquage automatique ajoute gclid, compté comme recherche payante de google_ads. Pour voir le nom des campagnes, ajoutez ceci comme suffixe de l''URL finale :'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Publicités Meta (Facebook, Instagram) : fbclid est ajouté automatiquement, compté comme réseaux sociaux de meta. Pour voir le nom des campagnes, ajoutez ceci aux paramètres d''URL de l''annonce :'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam) : le marquage automatique ajoute utm_source=seznam et utm_medium=cpc, compté comme recherche payante de seznam. Sans marquage automatique, sznclid est compté de la même façon.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'utm_medium détermine le canal : cpc, ppc ou paid → recherche payante, depuis un réseau social → réseaux sociaux ; social → réseaux sociaux ; email ou newsletter → e-mail ; display, banner ou cpm → display ; affiliate → affiliation ; organic → recherche naturelle ; referral → sites référents ; tout le reste → campagne. Sans utm_medium, utm_source décide : un assistant IA, un réseau social, un moteur de recherche ou une newsletter, sinon campagne.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Un autre domaine qui mène ici (un ancien ou un court) : indiquez-le dans aliases.hosts de %file%, avec ce site comme aliases.target. L''extension répond alors à ce domaine, compte la visite et redirige.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'Un code QR, une affiche ou tout lien imprimé : faites pointer vers l''adresse ci-dessous et ajoutez son marqueur (ici poster-a2) à aliases.hosts.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Si la redirection se fait ailleurs (chez le registraire ou dans le serveur web), faites-lui ajouter ?ra_via=<domain> à l''adresse et mettez aliases.mode sur tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Les visites via un alias comptent aussi dans leur canal : l''alias indique l''adresse utilisée, le canal comment ils y sont arrivés.'

