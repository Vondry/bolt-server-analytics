'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'Ebben a sorrendben: a hivatkozás UTM-paraméterei, a hirdetési hálózat által hozzáadott kattintásazonosító (gclid, fbclid, …), az oldal, ahonnan a látogató jött.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Közvetlen: begépelt cím, könyvjelző vagy semmit el nem áruló alkalmazás. Ismeretlen: semmi támpont.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Tegyen UTM-paramétereket a közzétett hivatkozásokba: az utm_campaign a kampány neve, az utm_source a hely, az utm_medium a csatorna fajtája.'
'Newsletter': 'Hírlevél'
'Social media post': 'Közösségimédia-bejegyzés'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: az automatikus címkézés hozzáadja a gclid-et, ez fizetett keresésnek számít a google_ads forrásból. A kampánynevekhez adja meg ezt végső URL-utótagként:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Meta-hirdetések (Facebook, Instagram): az fbclid automatikusan bekerül, ez közösségi médiának számít a meta forrásból. A kampánynevekhez adja hozzá ezt a hirdetés URL-paramétereihez:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): az automatikus címkézés hozzáadja az utm_source=seznam és utm_medium=cpc paramétereket, ez fizetett keresésnek számít a seznam forrásból. Automatikus címkézés nélkül az sznclid ugyanígy számít.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'A csatornát az utm_medium határozza meg: cpc, ppc vagy paid → fizetett keresés, közösségi oldalról → közösségi média; social → közösségi média; email vagy newsletter → e-mail; display, banner vagy cpm → display; affiliate → partnerprogram; organic → organikus keresés; referral → hivatkozó oldalak; bármi más → kampány. utm_medium nélkül az utm_source dönt: MI-asszisztens, közösségi oldal, keresőmotor vagy hírlevél, egyébként kampány.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Egy másik domain, amely ide vezet (korábbi vagy rövid): vegye fel a(z) %file% fájl aliases.hosts listájába, ezt az oldalt pedig aliases.target-ként. A bővítmény ekkor kiszolgálja azt a domaint, megszámolja a látogatást és átirányít.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'QR-kód, plakát vagy bármilyen nyomtatott hivatkozás: mutasson az alábbi címre, és vegye fel a jelölőjét (itt poster-a2) az aliases.hosts listába.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Ha az átirányítás máshol történik (a regisztrátornál vagy a webszerverben), az fűzze a címhez a ?ra_via=<domain> részt, az aliases.mode értéke pedig legyen tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Az aliason át érkező látogatások a csatornájukban is számítanak: az alias azt mutatja, melyik címet használták, a csatorna azt, hogyan jutottak oda.'

