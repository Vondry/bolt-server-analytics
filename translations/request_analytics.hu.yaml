'Insights need %days% complete days of statistics (so far: %count%). The first ones can appear on %day%.': 'A megállapításokhoz %days% teljes nap statisztika kell (eddig: %count%). Az elsők ekkor jelenhetnek meg: %day%.'
'Too few visits to tell a real problem from chance (last %days% days: %count%). Insights appear as the site gets more visits.': 'Túl kevés látogatás ahhoz, hogy egy valódi problémát meg lehessen különböztetni a véletlentől (utolsó %days% nap: %count%). A megállapítások akkor jelennek meg, ha a webhelynek több látogatása lesz.'
'Nothing needs attention so far. Checks that compare longer periods start once there are %days% days of statistics, on %day%.': 'Egyelőre semmi sem igényel figyelmet. A hosszabb időszakokat összehasonlító ellenőrzések %days% nap statisztika után indulnak: %day%.'
'Nothing needs attention. Broken links, site search, languages, visits and browsers of the last %days% days look fine.': 'Semmi sem igényel figyelmet. A hibás hivatkozások, a keresés a webhelyen, a nyelvek, a látogatások és a böngészők az utolsó %days% napban rendben vannak.'

# Deleting statistics (administrators and developers)
'Manage statistics': 'Statisztika kezelése'
'Delete statistics': 'Statisztika törlése'
'Delete the statistics of the last days, or all of them. Deleted statistics cannot be recovered.': 'Törli az utolsó napok statisztikáját vagy a teljes statisztikát. A törölt statisztika nem állítható vissza.'
'Delete statistics…': 'Statisztika törlése…'
'Close': 'Bezárás'
'Which statistics should be deleted? The period always ends now; older statistics stay as they are.': 'Melyik statisztikát szeretné törölni? Az időszak mindig most ér véget; a régebbi statisztika változatlan marad.'
'Period to delete': 'Törlendő időszak'
'Today': 'Ma'
'Last 90 days': 'Utolsó 90 nap'
'Number of days': 'Napok száma'
'Everything': 'Minden'
'All statistics ever collected': 'Az összes eddig gyűjtött statisztika'
'From %date%': '%date% óta'
'Cancel': 'Mégse'
'Continue': 'Tovább'
'Delete permanently?': 'Végleges törlés?'
'The statistics from %date% to now will be deleted:': 'A(z) %date% és most közötti statisztika törlődik:'
'All statistics will be deleted:': 'A teljes statisztika törlődik:'
'All statistics, collected since %date%, will be deleted:': 'A teljes statisztika, amelyet %date% óta gyűjtünk, törlődik:'
'And everything else of these days: pages, sources, devices, languages, site searches, broken links and bots.': 'És minden más ezekből a napokból: oldalak, források, eszközök, nyelvek, webhelyen belüli keresések, hibás hivatkozások és botok.'
'This cannot be undone. The statistics are erased for good; only a backup of the database can bring them back.': 'Ez nem vonható vissza. A statisztika végleg törlődik; csak az adatbázis biztonsági mentése tudja visszaállítani.'
'I understand that the deleted statistics cannot be recovered.': 'Tudomásul veszem, hogy a törölt statisztika nem állítható vissza.'
'Delete permanently': 'Végleges törlés'
'The statistics could not be counted.': 'A statisztikát nem sikerült megszámolni.'
'The statistics could not be deleted.': 'A statisztikát nem sikerült törölni.'
'All statistics were deleted.': 'A teljes statisztika törölve.'
'The statistics of the chosen period were deleted.': 'A kiválasztott időszak statisztikája törölve.'
'The statistics are being aggregated right now. Try again in a minute.': 'A statisztika összesítése éppen folyamatban van. Próbálja újra egy perc múlva.'
