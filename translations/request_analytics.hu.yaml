# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% erre hivatkozik: %path%, de ez az oldal nem létezik (kérések: %count%).'
'Fix or remove the link on that page.': 'Javítsa vagy törölje a hivatkozást azon az oldalon.'
'Probably %target% was meant: fix the link on that page.': 'Valószínűleg ez volt a cél: %target%. Javítsa a hivatkozást azon az oldalon.'
'%path% does not exist, and gets %count% requests from %host%.': 'Nem létező oldal: %path%. %count% kérés érkezik rá innen: %host%.'
'%path% does not exist, and gets %count% requests from other sites.': 'Nem létező oldal: %path%. %count% kérés érkezik rá más webhelyekről.'
'Redirect it to the page that replaced it.': 'Irányítsa át arra az oldalra, amely felváltotta.'
'Redirect it to %target%.': 'Irányítsa át ide: %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Böngésző: %subject%. A látogatások nagyjából ettől a naptól: %day% csak %after% oldalt nyitnak meg látogatásonként %before% helyett. A többi böngésző változatlan.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Eszköz: %subject%. A látogatások nagyjából ettől a naptól: %day% csak %after% oldalt nyitnak meg látogatásonként %before% helyett. A többi eszköz változatlan.'
'Test the site in %subject%, especially what was deployed around that day.': 'Tesztelje a webhelyet ebben a böngészőben: %subject%, főleg azt, amit a nap körül élesítettek.'
'Test the site on %subject%, especially what was deployed around that day.': 'Tesztelje a webhelyet ezen az eszközön: %subject%, főleg azt, amit a nap körül élesítettek.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': 'Nap: %day%. A Bolt nem rögzített oldalmegtekintést, de botok jöttek: valószínűleg egy gyorsítótár vagy CDN válaszol a Bolt nélkül, vagy ki van kapcsolva a gyűjtés.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Ellenőrizze, hogy az oldalkérések eljutnak-e a Boltig, és hogy a bővítmény be van-e kapcsolva.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': 'Nap: %day%. Egyetlen kérés sem érkezett: a webhely valószínűleg elérhetetlen volt, vagy nem futott az összesítés.'
'Check the server log of that day, and that the rollup runs.': 'Ellenőrizze annak a napnak a szervernaplóját, és hogy fut-e az összesítés.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': 'Hivatkozó oldalként számolva: %host% (látogatások: %count%). A webhely oldalai közötti átlépések valószínűleg új látogatásnak számítanak.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Adja hozzá ezeket: %hosts% a(z) %setting% beállításhoz a Request Analytics konfigurációjában.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': 'A látogatások %share% része hivatkozó nélkül érkezik, és egy látogatás csak %per_visit% oldalt nyit meg: valószínűleg az oldalak közötti kattintások is hivatkozó nélkül érkeznek, így mindegyik új látogatásnak számít.'
'Send the header %header%.': 'Küldje el ezt a fejlécet: %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': '%count% látogatás (%share%) olyan böngészőből érkezik, amely elsőként ezt a nyelvet kéri: %language%. A webhelynek nincsenek oldalai ezen a nyelven, és ezek a látogatások %per_visit% oldalt nyitnak meg látogatásonként, a többiek %others% oldalt.'
'Translate the pages most visits start on first.': 'Először azokat az oldalakat fordítsa le, ahol a legtöbb látogatás kezdődik.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Először azokat az oldalakat fordítsa le, ahol a legtöbb látogatás kezdődik: %pages% (a látogatások %pages_share% része itt kezdődik).'
'%count% searches for %term%, and no page is about it.': 'Keresések erre: %term% – %count%, és egyetlen oldal sem szól róla.'
'Write one, or add the word to a page that answers it.': 'Írjon egyet, vagy vegye fel a szót egy olyan oldalra, amely választ ad rá.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': 'Keresések erre: %term% – %count%, pedig ez az oldal létezik: %page%. Valószínűleg nehéz megtalálni.'
'Link it from the menu or the homepage.': 'Hivatkozzon rá a menüből vagy a kezdőlapról.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': 'A látogatások %visit_share% része ezt a nyelvet részesíti előnyben: %language%, többen, mint ezt: %default%. A webhely alapértelmezett nyelve mégis ez: %default%, és az oldalmegtekintések %default_share% része ezen a nyelven marad.'
'Make %language% the default language, or offer it on the homepage.': 'Legyen az alapértelmezett nyelv ez: %language%, vagy kínálja fel a kezdőlapon.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': 'A látogatások %visit_share% része ezt a nyelvet részesíti előnyben: %language%, de az oldalmegtekintéseknek csak %view_share% része van ezen a nyelven.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'A látogatások valószínűleg nem találják a nyelvválasztót: tegye a fejlécbe, a nyelv nevével, ne csak zászlóval.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'A látogatások megtalálják a nyelvválasztót, de rossz nyelvre érkeznek: adjon hozzá hreflang hivatkozásokat, tegye a fordításokat az oldaltérképbe, és a belépő oldalakon kínálja fel ezt a nyelvet: %language% (javaslatként, soha nem kényszerített átirányításként).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'A látogatások megtalálják a nyelvválasztót, de rossz nyelvre érkeznek: adjon hozzá hreflang hivatkozásokat, tegye a fordításokat az oldaltérképbe, és kínálja fel ezt a nyelvet: %language% azokon az oldalakon, ahol a legtöbben váltanak: %pages% (javaslatként, soha nem kényszerített átirányításként).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: %count% oldalmegtekintés 90 nap alatt (%share%), és a látogatások %visit_share% része részesíti előnyben ezt a nyelvet.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Lehet, hogy nem éri meg naprakészen tartani: csak a legfontosabb oldalakat fordítsa, ne fordítsa az új tartalmakat, vagy távolítsa el a nyelvet.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% együtt: %count% oldalmegtekintés 90 nap alatt (%share%), és a látogatások %visit_share% része részesíti előnyben valamelyiket.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Lehet, hogy nem éri meg naprakészen tartani őket: csak a legfontosabb oldalakat fordítsa, ne fordítsa az új tartalmakat, vagy távolítson el néhány nyelvet.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Látogatások: %change% (%before% → %after%). Csatorna: %channel%, a csökkenés %share% része. A látogatások ráadásul kevesebb oldalt nyitnak meg.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Látogatások: %change% (%before% → %after%). Csatorna: %channel%, a csökkenés %share% része.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Látogatások: %change% (%before% → %after%). Csatorna: %channel%, a csökkenés %share% része, főleg: %pages%. A látogatások ráadásul kevesebb oldalt nyitnak meg.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Látogatások: %change% (%before% → %after%). Csatorna: %channel%, a csökkenés %share% része, főleg: %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Ellenőrizze ezeknek az oldalaknak a helyezését a keresőkben, és hogy változott-e a címük vagy az URL-jük.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Valószínűleg leállt egy rendszeres bejegyzés vagy kampány: nézze meg, mi jelent meg ott korábban.'
'Probably a linking site removed its link.': 'Valószínűleg egy hivatkozó webhely eltávolította a hivatkozását.'
'Probably %source% removed its link: check the linking page.': 'Valószínűleg ez a webhely eltávolította a hivatkozását: %source%. Ellenőrizze a hivatkozó oldalt.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Ellenőrizze a könyvjelzőket és a nyomtatott hivatkozásokat (plakátok, QR-kódok), amelyek ezekre az oldalakra vezetnek.'
