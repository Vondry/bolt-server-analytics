'A request is a bot when its User-Agent names one, or when its headers contradict the browser it claims to be. Bots are not counted in page views, visits or any other card. AI crawlers collect pages for AI models and answer engines; robots.txt can ask them to stay away.': 'Egy kérés bot, ha a User-Agent annak nevezi, vagy ha a fejlécei ellentmondanak a böngészőnek, aminek mondja magát. A botok nem számítanak bele az oldalmegtekintésekbe, látogatásokba és más kártyákba. Az AI-bejárók oldalakat gyűjtenek AI-modellekhez és válaszmotorokhoz; a robots.txt-ben megkérhetők, hogy maradjanak távol.'
