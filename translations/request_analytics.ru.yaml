'A request is a bot when its User-Agent names one, or when its headers contradict the browser it claims to be. Bots are not counted in page views, visits or any other card. AI crawlers collect pages for AI models and answer engines; robots.txt can ask them to stay away.': 'Запрос считается ботом, если его User-Agent называет бота или если его заголовки противоречат браузеру, за который он себя выдаёт. Боты не учитываются в просмотрах, визитах и других карточках. ИИ-краулеры собирают страницы для ИИ-моделей и ответных систем; в robots.txt их можно попросить не заходить.'
'Where visitors came from and went next': 'Откуда пришли посетители и куда пошли дальше'
