'Pages with fewer than %count% moves are counted as Other pages.': 'Страницы с менее чем %count% переходами учитываются как Другие страницы.'

# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% ссылается на %path%, но такой страницы нет (запросов: %count%).'
'Fix or remove the link on that page.': 'Исправьте или удалите ссылку на этой странице.'
'Probably %target% was meant: fix the link on that page.': 'Вероятно, имелась в виду страница %target%: исправьте ссылку на этой странице.'
'%path% does not exist, and gets %count% requests from %host%.': 'Страницы %path% нет, но на неё ведут запросы с сайта %host% (запросов: %count%).'
'%path% does not exist, and gets %count% requests from other sites.': 'Страницы %path% нет, но на неё ведут запросы с других сайтов (запросов: %count%).'
'Redirect it to the page that replaced it.': 'Перенаправьте её на страницу, которая её заменила.'
'Redirect it to %target%.': 'Перенаправьте её на %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Визиты в браузере %subject% примерно с %day% открывают лишь %after% страницы за визит вместо %before%. В других браузерах ничего не изменилось.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Визиты (устройство: %subject%) примерно с %day% открывают лишь %after% страницы за визит вместо %before%. На других устройствах ничего не изменилось.'
'Test the site in %subject%, especially what was deployed around that day.': 'Протестируйте сайт в браузере %subject%, особенно то, что выкладывали около этого дня.'
'Test the site on %subject%, especially what was deployed around that day.': 'Протестируйте сайт на устройстве типа %subject%, особенно то, что выкладывали около этого дня.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': '%day% Bolt не зарегистрировал ни одного просмотра страниц, но боты приходили: вероятно, кэш или CDN отвечает без Bolt, либо сбор данных выключен.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Проверьте, что запросы страниц доходят до Bolt и что расширение включено.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': '%day% не было ни одного запроса: вероятно, сайт был недоступен или агрегация не запускалась.'
'Check the server log of that day, and that the rollup runs.': 'Проверьте лог сервера за этот день и то, что агрегация запускается.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': '%host% считается ссылкой с другого сайта (визитов: %count%): вероятно, переходы между страницами этого сайта считаются новыми визитами.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Добавьте %hosts% в %setting% в конфигурации Request Analytics.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': '%share% визитов приходят без реферера, и визит открывает лишь %per_visit% страницы: вероятно, клики между страницами тоже приходят без него, и каждый считается новым визитом.'
'Send the header %header%.': 'Отправляйте заголовок %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': 'Визитов из браузеров, которые первым просят язык %language%: %count% (%share%). На сайте нет страниц на этом языке, и эти визиты открывают %per_visit% страницы за визит против %others% у остальных.'
'Translate the pages most visits start on first.': 'Сначала переведите страницы, с которых начинается больше всего визитов.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Сначала переведите страницы, с которых начинается больше всего визитов: %pages% (с них начинается %pages_share% визитов).'
'%count% searches for %term%, and no page is about it.': 'Поисков по запросу %term%: %count%, и ни одна страница не посвящена этому.'
'Write one, or add the word to a page that answers it.': 'Напишите такую страницу или добавьте это слово на страницу, которая отвечает на вопрос.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': 'Поисков по запросу %term%: %count%, хотя страница %page% существует: вероятно, её трудно найти.'
'Link it from the menu or the homepage.': 'Добавьте ссылку на неё в меню или на главную страницу.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': '%visit_share% визитов предпочитают язык %language%, больше, чем язык %default%, но язык сайта по умолчанию — %default%, и в нём остаются %default_share% просмотров страниц.'
'Make %language% the default language, or offer it on the homepage.': 'Сделайте языком по умолчанию %language% или предложите его на главной странице.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': '%visit_share% визитов предпочитают язык %language%, но на этом языке лишь %view_share% просмотров страниц.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Визиты, вероятно, не находят переключатель языков: поместите его в шапку, с названием языка, а не только с флагом.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'Визиты находят переключатель языков, но попадают не на тот язык: добавьте ссылки hreflang, внесите переводы в sitemap и предложите язык %language% на входных страницах (как предложение, никогда не как принудительное перенаправление).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'Визиты находят переключатель языков, но попадают не на тот язык: добавьте ссылки hreflang, внесите переводы в sitemap и предложите язык %language% на страницах, где чаще всего переключают язык: %pages% (как предложение, никогда не как принудительное перенаправление).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: просмотров страниц за 90 дней — %count% (%share%), и этот язык предпочитают %visit_share% визитов.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Поддерживать его в актуальном состоянии может быть невыгодно: переводите только ключевые страницы, перестаньте переводить новый контент или удалите язык.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% вместе: просмотров страниц за 90 дней — %count% (%share%), и один из этих языков предпочитают %visit_share% визитов.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Поддерживать их в актуальном состоянии может быть невыгодно: переводите только ключевые страницы, перестаньте переводить новый контент или удалите некоторые языки.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Визиты: %change% (%before% → %after%). На канал %channel% приходится %share% потерь. Визиты к тому же открывают меньше страниц.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Визиты: %change% (%before% → %after%). На канал %channel% приходится %share% потерь.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Визиты: %change% (%before% → %after%). На канал %channel% приходится %share% потерь, в основном %pages%. Визиты к тому же открывают меньше страниц.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Визиты: %change% (%before% → %after%). На канал %channel% приходится %share% потерь, в основном %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Проверьте позиции этих страниц в поиске и не изменились ли их заголовок или адрес.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Вероятно, прекратилась регулярная публикация или кампания: проверьте, что там публиковалось раньше.'
'Probably a linking site removed its link.': 'Вероятно, какой-то сайт убрал ссылку.'
'Probably %source% removed its link: check the linking page.': 'Вероятно, сайт %source% убрал ссылку: проверьте ссылающуюся страницу.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Проверьте закладки и печатные ссылки (плакаты, QR-коды), ведущие на эти страницы.'
'Setup': 'Настройка'
'Fix': 'Исправление'
'Grow': 'Рост'
'Decide': 'Решение'
'Last %days% days vs. the %days% days before': 'Последние %days% дней по сравнению с %days% днями до них'
'Last %days% days': 'Последние %days% дней'
'and %count% more': 'и ещё %count%'
'Details': 'Подробнее'
'Insights': 'Выводы'
'Hide': 'Скрыть'
'Show': 'Показать'
'Show all (%count%)': 'Показать все (%count%)'
'Show fewer': 'Показать меньше'
'No statistics yet. Insights need %days% complete days of them and then appear here on their own.': 'Статистики пока нет. Для выводов нужно %days% полных дней статистики, после этого они появятся здесь сами.'
'Insights need %days% complete days of statistics (so far: %count%). The first ones can appear on %day%.': 'Для выводов нужно %days% полных дней статистики (пока: %count%). Первые могут появиться %day%.'
'Too few visits to tell a real problem from chance (last %days% days: %count%). Insights appear as the site gets more visits.': 'Слишком мало визитов, чтобы отличить реальную проблему от случайности (последние %days% дней: %count%). Выводы появятся, когда у сайта станет больше визитов.'
'Nothing needs attention so far. Checks that compare longer periods start once there are %days% days of statistics, on %day%.': 'Пока ничего не требует внимания. Проверки, сравнивающие более длинные периоды, начнутся, когда наберётся %days% дней статистики: %day%.'
'Nothing needs attention. Broken links, site search, languages, visits and browsers of the last %days% days look fine.': 'Ничего не требует внимания. Битые ссылки, поиск по сайту, языки, визиты и браузеры за последние %days% дней в порядке.'

# Deleting statistics (administrators and developers)
'Manage statistics': 'Управление статистикой'
'Delete statistics': 'Удалить статистику'
'Delete the statistics of the last days, or all of them. Deleted statistics cannot be recovered.': 'Удаляет статистику за последние дни или всю статистику. Удалённую статистику нельзя восстановить.'
'Delete statistics…': 'Удалить статистику…'
'Close': 'Закрыть'
'Which statistics should be deleted? The period always ends now; older statistics stay as they are.': 'Какую статистику удалить? Период всегда заканчивается сейчас; более старая статистика остаётся без изменений.'
'Period to delete': 'Период для удаления'
'Today': 'Сегодня'
'Last 90 days': 'Последние 90 дней'
'Number of days': 'Количество дней'
'Everything': 'Всё'
'All statistics ever collected': 'Вся собранная статистика'
'From %date%': 'С %date%'
'Cancel': 'Отмена'
'Continue': 'Продолжить'
'Delete permanently?': 'Удалить навсегда?'
'The statistics from %date% to now will be deleted:': 'Статистика с %date% по настоящий момент будет удалена:'
'All statistics will be deleted:': 'Вся статистика будет удалена:'
'All statistics, collected since %date%, will be deleted:': 'Вся статистика, собираемая с %date%, будет удалена:'
'And everything else of these days: pages, sources, devices, languages, site searches, broken links and bots.': 'А также всё остальное за эти дни: страницы, источники, устройства, языки, поиск по сайту, битые ссылки и боты.'
'This cannot be undone. The statistics are erased for good; only a backup of the database can bring them back.': 'Это действие нельзя отменить. Статистика удаляется навсегда; восстановить её можно только из резервной копии базы данных.'
'I understand that the deleted statistics cannot be recovered.': 'Я понимаю, что удалённую статистику нельзя восстановить.'
'Delete permanently': 'Удалить навсегда'
'The statistics could not be counted.': 'Не удалось подсчитать статистику.'
'The statistics could not be deleted.': 'Не удалось удалить статистику.'
'All statistics were deleted.': 'Вся статистика удалена.'
'The statistics of the chosen period were deleted.': 'Статистика за выбранный период удалена.'
'The statistics are being aggregated right now. Try again in a minute.': 'Статистика сейчас агрегируется. Повторите попытку через минуту.'
