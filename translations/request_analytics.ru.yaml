'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'В таком порядке: UTM-параметры ссылки, идентификатор клика, который добавляет рекламная сеть (gclid, fbclid, …), страница, с которой пришёл посетитель.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Прямые заходы: введённый адрес, закладка или приложение, которое ничего не сообщает. Неизвестно: никаких подсказок.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Добавляйте UTM-параметры к публикуемым ссылкам: utm_campaign — название кампании, utm_source — место, utm_medium — вид канала.'
'Newsletter': 'Рассылка'
'Social media post': 'Пост в соцсетях'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: автоматическая пометка добавляет gclid, это считается платным поиском из google_ads. Чтобы видеть названия кампаний, добавьте это как суффикс конечного URL:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Реклама Meta (Facebook, Instagram): fbclid добавляется автоматически, это считается соцсетями из meta. Чтобы видеть названия кампаний, добавьте это в параметры URL объявления:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): автоматическая разметка добавляет utm_source=seznam и utm_medium=cpc, это считается платным поиском из seznam. Без автоматической разметки sznclid считается так же.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'Канал определяет utm_medium: cpc, ppc или paid → платный поиск, из соцсети → соцсети; social → соцсети; email или newsletter → эл. почта; display, banner или cpm → медийная реклама; affiliate → партнёрские сети; organic → органический поиск; referral → ссылки с сайтов; всё остальное → кампания. Без utm_medium решает utm_source: ИИ-ассистент, соцсеть, поисковая система или рассылка, иначе кампания.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Другой домен, ведущий сюда (прежний или короткий): укажите его в aliases.hosts в %file%, а этот сайт — как aliases.target. Расширение будет отвечать на этом домене, засчитает визит и перенаправит.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'QR-код, плакат или любая печатная ссылка: ведите на адрес ниже и добавьте его метку (здесь poster-a2) в aliases.hosts.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Если перенаправление происходит в другом месте (у регистратора или в веб-сервере), пусть оно добавляет к адресу ?ra_via=<domain>, а aliases.mode установите в tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Визиты через алиас учитываются и в своём канале: алиас показывает, каким адресом воспользовались, канал — как к нему попали.'

