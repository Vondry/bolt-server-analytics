'No statistics yet. Insights need %days% complete days of them and then appear here on their own.': 'Noch keine Statistiken. Erkenntnisse brauchen %days% vollständige Tage davon und erscheinen dann hier von selbst.'
'Insights need %days% complete days of statistics (so far: %count%). The first ones can appear on %day%.': 'Erkenntnisse brauchen %days% vollständige Tage Statistik (bisher: %count%). Die ersten können am %day% erscheinen.'
'Too few visits to tell a real problem from chance (last %days% days: %count%). Insights appear as the site gets more visits.': 'Zu wenige Besuche, um ein echtes Problem vom Zufall zu unterscheiden (letzte %days% Tage: %count%). Erkenntnisse erscheinen, sobald die Website mehr Besuche hat.'
'Nothing needs attention so far. Checks that compare longer periods start once there are %days% days of statistics, on %day%.': 'Bisher ist nichts zu tun. Prüfungen, die längere Zeiträume vergleichen, beginnen, sobald %days% Tage Statistik vorliegen, am %day%.'
'Nothing needs attention. Broken links, site search, languages, visits and browsers of the last %days% days look fine.': 'Nichts zu tun. Defekte Links, Suche auf der Website, Sprachen, Besuche und Browser der letzten %days% Tage sind in Ordnung.'

# Deleting statistics (administrators and developers)
