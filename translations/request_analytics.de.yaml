'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'In dieser Reihenfolge: die UTM-Parameter des Links, die Klick-ID eines Werbenetzwerks (gclid, fbclid, …), die Seite, von der der Besucher kam.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Direkt: eine eingetippte Adresse, ein Lesezeichen oder eine App, die nichts verrät. Unbekannt: gar kein Hinweis.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Ergänzen Sie die Links, die Sie veröffentlichen, um UTM-Parameter: utm_campaign benennt die Kampagne, utm_source den Ort, utm_medium die Art des Kanals.'
'Newsletter': 'Newsletter'
'Social media post': 'Beitrag in sozialen Netzwerken'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: Die automatische Tag-Kennzeichnung fügt gclid hinzu, gezählt als bezahlte Suche von google_ads. Für Kampagnennamen dies als Suffix der finalen URL eintragen:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Meta-Anzeigen (Facebook, Instagram): fbclid wird automatisch angehängt, gezählt als soziale Netzwerke von meta. Für Kampagnennamen dies in die URL-Parameter der Anzeige eintragen:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): Die automatische Kennzeichnung hängt utm_source=seznam und utm_medium=cpc an, gezählt als bezahlte Suche von seznam. Ohne sie wird sznclid genauso gezählt.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'utm_medium bestimmt den Kanal: cpc, ppc oder paid → bezahlte Suche, von einem sozialen Netzwerk → soziale Netzwerke; social → soziale Netzwerke; email oder newsletter → E-Mail; display, banner oder cpm → Display; affiliate → Affiliate; organic → organische Suche; referral → Verweise; alles andere → Kampagne. Ohne utm_medium entscheidet utm_source: ein KI-Assistent, ein soziales Netzwerk, eine Suchmaschine oder ein Newsletter, sonst Kampagne.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Eine andere Domain, die hierher führt (eine frühere oder eine kurze): tragen Sie sie in aliases.hosts in %file% ein, diese Website als aliases.target. Die Erweiterung beantwortet diese Domain, zählt den Besuch und leitet weiter.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'Ein QR-Code, ein Plakat oder ein gedruckter Link: verlinken Sie auf die Adresse unten und tragen Sie ihre Markierung (hier poster-a2) in aliases.hosts ein.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Wenn die Weiterleitung anderswo geschieht (beim Registrar oder im Webserver), lassen Sie sie ?ra_via=<domain> an die Adresse anhängen und setzen Sie aliases.mode auf tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Besuche über einen Alias zählen auch in ihrem Kanal: Der Alias sagt, welche Adresse sie benutzt haben, der Kanal, wie sie zu ihr kamen.'

