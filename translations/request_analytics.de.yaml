# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% verlinkt auf %path%, die nicht existiert (Anfragen: %count%).'
'Fix or remove the link on that page.': 'Korrigieren oder entfernen Sie den Link auf dieser Seite.'
'Probably %target% was meant: fix the link on that page.': 'Gemeint war wahrscheinlich %target%: Korrigieren Sie den Link auf dieser Seite.'
'%path% does not exist, and gets %count% requests from %host%.': '%path% existiert nicht und erhält %count% Anfragen von %host%.'
'%path% does not exist, and gets %count% requests from other sites.': '%path% existiert nicht und erhält %count% Anfragen von anderen Websites.'
'Redirect it to the page that replaced it.': 'Leiten Sie sie auf die Seite um, die sie ersetzt hat.'
'Redirect it to %target%.': 'Leiten Sie sie auf %target% um.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Besuche mit %subject% öffnen seit etwa %day% nur %after% Seiten pro Besuch statt %before%. Andere Browser sind unverändert.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Besuche auf dem Gerät %subject% öffnen seit etwa %day% nur %after% Seiten pro Besuch statt %before%. Andere Geräte sind unverändert.'
'Test the site in %subject%, especially what was deployed around that day.': 'Testen Sie die Website in %subject%, vor allem, was um diesen Tag herum veröffentlicht wurde.'
'Test the site on %subject%, especially what was deployed around that day.': 'Testen Sie die Website auf dem Gerät %subject%, vor allem, was um diesen Tag herum veröffentlicht wurde.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': 'Am %day% hat Bolt keine Seitenaufrufe erfasst, aber Bots kamen: Wahrscheinlich antwortet ein Cache oder CDN ohne Bolt, oder die Erfassung ist aus.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Prüfen Sie, ob Seitenanfragen Bolt erreichen und ob die Erweiterung aktiviert ist.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': 'Am %day% gab es überhaupt keine Anfragen: Die Website war wahrscheinlich nicht erreichbar, oder die Aggregation lief nicht.'
'Check the server log of that day, and that the rollup runs.': 'Prüfen Sie das Serverprotokoll dieses Tages und ob die Aggregation läuft.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': '%host% wird als Verweis gezählt (Besuche: %count%): Wechsel zwischen Seiten dieser Website zählen wahrscheinlich als neue Besuche.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Fügen Sie %hosts% zu %setting% in der Konfiguration von Request Analytics hinzu.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': '%share% der Besuche kommen ohne Referrer, und ein Besuch öffnet nur %per_visit% Seiten: Wahrscheinlich kommen auch Klicks zwischen den Seiten ohne Referrer, sodass jeder als neuer Besuch zählt.'
'Send the header %header%.': 'Senden Sie den Header %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': '%count% Besuche (%share%) kommen von Browsern, die zuerst nach der Sprache %language% fragen. Die Website hat keine Seiten in dieser Sprache, und diese Besuche öffnen %per_visit% Seiten pro Besuch gegenüber %others% bei den anderen.'
'Translate the pages most visits start on first.': 'Übersetzen Sie zuerst die Seiten, auf denen die meisten Besuche beginnen.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Übersetzen Sie zuerst die Seiten, auf denen die meisten Besuche beginnen: %pages% (dort beginnen %pages_share% der Besuche).'
'%count% searches for %term%, and no page is about it.': '%count% Suchen nach %term%, und keine Seite behandelt das Thema.'
'Write one, or add the word to a page that answers it.': 'Schreiben Sie eine, oder ergänzen Sie das Wort auf einer Seite, die die Frage beantwortet.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': '%count% Suchen nach %term%, obwohl %page% existiert: Die Seite ist wahrscheinlich schwer zu finden.'
'Link it from the menu or the homepage.': 'Verlinken Sie sie im Menü oder auf der Startseite.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': '%visit_share% der Besuche bevorzugen %language%, mehr als %default%, aber die Standardsprache der Website ist %default%, und %default_share% der Seitenaufrufe bleiben in dieser Sprache.'
'Make %language% the default language, or offer it on the homepage.': 'Machen Sie %language% zur Standardsprache, oder bieten Sie die Sprache auf der Startseite an.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': '%visit_share% der Besuche bevorzugen %language%, aber nur %view_share% der Seitenaufrufe sind in dieser Sprache.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Besuche finden den Sprachumschalter wahrscheinlich nicht: Setzen Sie ihn in den Kopfbereich, mit dem Namen der Sprache und nicht nur einer Flagge.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'Besuche finden den Sprachumschalter, landen aber in der falschen Sprache: Ergänzen Sie hreflang-Links, nehmen Sie die Übersetzungen in die Sitemap auf und bieten Sie %language% auf den Einstiegsseiten an (als Vorschlag, nie als erzwungene Weiterleitung).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'Besuche finden den Sprachumschalter, landen aber in der falschen Sprache: Ergänzen Sie hreflang-Links, nehmen Sie die Übersetzungen in die Sitemap auf und bieten Sie %language% auf den Seiten an, auf denen am häufigsten gewechselt wird: %pages% (als Vorschlag, nie als erzwungene Weiterleitung).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: %count% Seitenaufrufe in 90 Tagen (%share%), und %visit_share% der Besuche bevorzugen diese Sprache.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Sie aktuell zu halten, lohnt sich vielleicht nicht: Übersetzen Sie nur die wichtigsten Seiten, übersetzen Sie keine neuen Inhalte mehr, oder entfernen Sie die Sprache.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% zusammen: %count% Seitenaufrufe in 90 Tagen (%share%), und %visit_share% der Besuche bevorzugen eine davon.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Sie aktuell zu halten, lohnt sich vielleicht nicht: Übersetzen Sie nur die wichtigsten Seiten, übersetzen Sie keine neuen Inhalte mehr, oder entfernen Sie einige Sprachen.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Besuche: %change% (%before% → %after%). %channel% macht %share% des Rückgangs aus. Besuche öffnen zudem weniger Seiten.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Besuche: %change% (%before% → %after%). %channel% macht %share% des Rückgangs aus.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Besuche: %change% (%before% → %after%). %channel% macht %share% des Rückgangs aus, vor allem %pages%. Besuche öffnen zudem weniger Seiten.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Besuche: %change% (%before% → %after%). %channel% macht %share% des Rückgangs aus, vor allem %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Prüfen Sie das Suchranking dieser Seiten und ob sich ihr Titel oder ihre Adresse geändert hat.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Wahrscheinlich endete ein regelmäßiger Beitrag oder eine Kampagne: Prüfen Sie, was dort vorher veröffentlicht wurde.'
'Probably a linking site removed its link.': 'Wahrscheinlich hat eine verlinkende Website ihren Link entfernt.'
'Probably %source% removed its link: check the linking page.': 'Wahrscheinlich hat %source% den Link entfernt: Prüfen Sie die verlinkende Seite.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Prüfen Sie Lesezeichen und gedruckte Links (Plakate, QR-Codes), die auf diese Seiten führen.'
