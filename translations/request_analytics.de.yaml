'A request is a bot when its User-Agent names one, or when its headers contradict the browser it claims to be. Bots are not counted in page views, visits or any other card. AI crawlers collect pages for AI models and answer engines; robots.txt can ask them to stay away.': 'Eine Anfrage ist ein Bot, wenn ihr User-Agent einen nennt oder ihre Header dem Browser widersprechen, der sie vorgibt zu sein. Bots zählen nicht zu Seitenaufrufen, Besuchen oder einer anderen Karte. KI-Crawler sammeln Seiten für KI-Modelle und Antwortmaschinen; per robots.txt kann man sie bitten, fernzubleiben.'
