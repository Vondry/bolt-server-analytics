'Delete statistics': 'Statistik löschen'
'Delete the statistics of the last days, or all of them. Deleted statistics cannot be recovered.': 'Löscht die Statistik der letzten Tage oder die gesamte Statistik. Gelöschte Statistiken lassen sich nicht wiederherstellen.'
'Delete statistics…': 'Statistik löschen…'
'Close': 'Schließen'
'Which statistics should be deleted? The period always ends now; older statistics stay as they are.': 'Welche Statistik soll gelöscht werden? Der Zeitraum endet immer jetzt; ältere Statistiken bleiben unverändert.'
'Period to delete': 'Zu löschender Zeitraum'
'Today': 'Heute'
'Last 90 days': 'Letzte 90 Tage'
'Number of days': 'Anzahl der Tage'
'Everything': 'Alles'
'All statistics ever collected': 'Die gesamte bisher erfasste Statistik'
'From %date%': 'Ab %date%'
'Cancel': 'Abbrechen'
'Continue': 'Weiter'
'Delete permanently?': 'Endgültig löschen?'
'The statistics from %date% to now will be deleted:': 'Die Statistik vom %date% bis jetzt wird gelöscht:'
'All statistics will be deleted:': 'Die gesamte Statistik wird gelöscht:'
'All statistics, collected since %date%, will be deleted:': 'Die gesamte Statistik, erfasst seit %date%, wird gelöscht:'
'And everything else of these days: pages, sources, devices, languages, site searches, broken links and bots.': 'Und alles andere dieser Tage: Seiten, Quellen, Geräte, Sprachen, Suchen auf der Website, defekte Links und Bots.'
'This cannot be undone. The statistics are erased for good; only a backup of the database can bring them back.': 'Dies kann nicht rückgängig gemacht werden. Die Statistik wird endgültig gelöscht; nur eine Sicherung der Datenbank kann sie wiederherstellen.'
'I understand that the deleted statistics cannot be recovered.': 'Mir ist bewusst, dass die gelöschte Statistik nicht wiederhergestellt werden kann.'
'Delete permanently': 'Endgültig löschen'
'The statistics could not be counted.': 'Die Statistik konnte nicht gezählt werden.'
'The statistics could not be deleted.': 'Die Statistik konnte nicht gelöscht werden.'
'All statistics were deleted.': 'Die gesamte Statistik wurde gelöscht.'
'The statistics of the chosen period were deleted.': 'Die Statistik des gewählten Zeitraums wurde gelöscht.'
'The statistics are being aggregated right now. Try again in a minute.': 'Die Statistik wird gerade zusammengefasst. Versuchen Sie es in einer Minute erneut.'
