# Insights
'%page% links to %path%, which does not exist (requests: %count%).': '%page% odkazuje na stránku %path%, ktorá neexistuje (počet požiadaviek: %count%).'
'Fix or remove the link on that page.': 'Opravte alebo odstráňte odkaz na tejto stránke.'
'Probably %target% was meant: fix the link on that page.': 'Odkaz mal pravdepodobne viesť na %target%: opravte ho na tejto stránke.'
'%path% does not exist, and gets %count% requests from %host%.': 'Stránka %path% neexistuje a smeruje na ňu %count% požiadaviek z webu %host%.'
'%path% does not exist, and gets %count% requests from other sites.': 'Stránka %path% neexistuje a smeruje na ňu %count% požiadaviek z iných webov.'
'Redirect it to the page that replaced it.': 'Presmerujte ju na stránku, ktorá ju nahradila.'
'Redirect it to %target%.': 'Presmerujte ju na %target%.'
'Visits in %subject% open %after% pages per visit, down from %before%, since about %day%. Other browsers are unchanged.': 'Návštevy v prehliadači %subject% otvárajú približne od %day% len %after% stránky na návštevu namiesto %before%. Pri ostatných prehliadačoch sa nič nezmenilo.'
'Visits on %subject% open %after% pages per visit, down from %before%, since about %day%. Other devices are unchanged.': 'Návštevy na zariadení %subject% otvárajú približne od %day% len %after% stránky na návštevu namiesto %before%. Pri ostatných zariadeniach sa nič nezmenilo.'
'Test the site in %subject%, especially what was deployed around that day.': 'Otestujte web v prehliadači %subject%, hlavne to, čo sa okolo toho dňa nasadzovalo.'
'Test the site on %subject%, especially what was deployed around that day.': 'Otestujte web na zariadení %subject%, hlavne to, čo sa okolo toho dňa nasadzovalo.'
'Bolt recorded no page views on %day%, but bots came: a cache or CDN probably answers without Bolt, or collection is off.': 'Dňa %day% Bolt nezaznamenal žiadne zobrazenie stránky, ale boti prišli: pravdepodobne odpovedá cache alebo CDN bez Boltu, alebo je zber vypnutý.'
'Check that page requests reach Bolt, and that the extension is enabled.': 'Overte, že požiadavky na stránky dôjdu až k Boltu a že je rozšírenie zapnuté.'
'No requests at all on %day%: the site was probably down, or the rollup did not run.': 'Dňa %day% neprišla vôbec žiadna požiadavka: web bol pravdepodobne nedostupný, alebo neprebehla agregácia.'
'Check the server log of that day, and that the rollup runs.': 'Skontrolujte log servera z toho dňa a to, že agregácia beží.'
'%host% is counted as a referral (%count% visits): moves between pages of this site probably count as new visits.': '%host% sa počíta ako odkaz z iného webu (návštev: %count%): prechody medzi stránkami tohto webu sa pravdepodobne počítajú ako nové návštevy.'
'Add %hosts% to %setting% in the config of Request Analytics.': 'Pridajte %hosts% do %setting% v konfigurácii Request Analytics.'
'%share% of visits arrive without a referrer, and a visit opens only %per_visit% pages: clicks between pages probably arrive without one too, so each counts as a new visit.': '%share% návštev prichádza bez referera a návšteva otvorí len %per_visit% stránky: pravdepodobne ho nemajú ani kliknutia medzi stránkami, takže sa každé počíta ako nová návšteva.'
'Send the header %header%.': 'Posielajte hlavičku %header%.'
'%count% visits (%share%) come from browsers asking for %language% first. The site has no pages in it, and these visits open %per_visit% pages per visit against %others% for the others.': '%count% návštev (%share%) má v prehliadači na prvom mieste jazyk %language%. Web v ňom nemá žiadne stránky a tieto návštevy otvoria %per_visit% stránky na návštevu, ostatné %others%.'
'Translate the pages most visits start on first.': 'Preložte najprv stránky, na ktorých začína najviac návštev.'
'Translate the pages most visits start on first: %pages% (%pages_share% of visits start there).': 'Preložte najprv stránky, na ktorých začína najviac návštev: %pages% (začína na nich %pages_share% návštev).'
'%count% searches for %term%, and no page is about it.': '%count% hľadaní výrazu %term% a žiadna stránka o ňom nie je.'
'Write one, or add the word to a page that answers it.': 'Napíšte ju, alebo to slovo doplňte na stránku, ktorá naň odpovedá.'
'%count% searches for %term%, and %page% exists: it is probably hard to find.': '%count% hľadaní výrazu %term%, pritom stránka %page% existuje: pravdepodobne sa ťažko hľadá.'
'Link it from the menu or the homepage.': 'Odkážte na ňu z menu alebo z úvodnej stránky.'
'%visit_share% of visits prefer %language%, more than %default%, but the site opens in %default%, and %default_share% of page views stay in it.': '%visit_share% návštev preferuje jazyk %language%, viac než jazyk %default%, ale predvolený jazyk webu je %default% a zostáva v ňom %default_share% zobrazení stránok.'
'Make %language% the default language, or offer it on the homepage.': 'Nastavte ako predvolený jazyk %language%, alebo ho ponúknite na úvodnej stránke.'
'%visit_share% of visits prefer %language%, but only %view_share% of page views are in %language%.': '%visit_share% návštev preferuje jazyk %language%, ale jazyk %language% má len %view_share% zobrazení stránok.'
'Visits probably do not find the language switcher: put it in the header, as the name of the language and not only a flag.': 'Návštevy pravdepodobne nenachádzajú prepínač jazykov: dajte ho do hlavičky, s názvom jazyka, nie len s vlajkou.'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on entry pages (a suggestion, never a forced redirect).': 'Návštevy prepínač jazykov nájdu, ale prichádzajú na nesprávny jazyk: doplňte odkazy hreflang, dajte preklady do sitemapy a na vstupných stránkach ponúknite jazyk %language% (ako ponuku, nikdy nie vynútené presmerovanie).'
'Visits find the language switcher, but arrive on the wrong language: add hreflang links, put the translations in the sitemap, and offer %language% on the pages they switch on most: %pages% (a suggestion, never a forced redirect).': 'Návštevy prepínač jazykov nájdu, ale prichádzajú na nesprávny jazyk: doplňte odkazy hreflang, dajte preklady do sitemapy a jazyk %language% ponúknite na stránkach, kde sa prepína najčastejšie: %pages% (ako ponuku, nikdy nie vynútené presmerovanie).'
'%language%: %count% page views in 90 days (%share%), and %visit_share% of visits prefer it.': '%language%: %count% zobrazení stránok za 90 dní (%share%) a tento jazyk preferuje %visit_share% návštev.'
'Keeping it up to date may not pay off: translate only the key pages, stop translating new content, or remove the language.': 'Udržiavať ho aktuálny sa nemusí oplatiť: prekladajte len kľúčové stránky, prestaňte prekladať nový obsah, alebo jazyk odstráňte.'
'%languages% together: %count% page views in 90 days (%share%), and %visit_share% of visits prefer one of them.': '%languages% spolu: %count% zobrazení stránok za 90 dní (%share%) a niektorý z týchto jazykov preferuje %visit_share% návštev.'
'Keeping them up to date may not pay off: translate only the key pages, stop translating new content, or remove some languages.': 'Udržiavať ich aktuálne sa nemusí oplatiť: prekladajte len kľúčové stránky, prestaňte prekladať nový obsah, alebo niektoré jazyky odstráňte.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss. Visits also open fewer pages per visit.': 'Návštevy: %change% (%before% → %after%). Kanál %channel% tvorí %share% úbytku. Návštevy navyše otvárajú menej stránok.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss.': 'Návštevy: %change% (%before% → %after%). Kanál %channel% tvorí %share% úbytku.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%. Visits also open fewer pages per visit.': 'Návštevy: %change% (%before% → %after%). Kanál %channel% tvorí %share% úbytku, hlavne %pages%. Návštevy navyše otvárajú menej stránok.'
'Visits fell %change% (%before% → %after%). %channel% accounts for %share% of the loss, mostly %pages%.': 'Návštevy: %change% (%before% → %after%). Kanál %channel% tvorí %share% úbytku, hlavne %pages%.'
'Check the search ranking of these pages, and whether their title or address changed.': 'Skontrolujte pozície týchto stránok vo vyhľadávaní a či sa nezmenil ich titulok alebo adresa.'
'Probably a recurring post or campaign stopped: check what was published there before.': 'Pravdepodobne skončil pravidelný príspevok alebo kampaň: skontrolujte, čo sa tam predtým publikovalo.'
'Probably a linking site removed its link.': 'Pravdepodobne niektorý web odstránil odkaz.'
'Probably %source% removed its link: check the linking page.': 'Pravdepodobne web %source% odstránil odkaz: skontrolujte odkazujúcu stránku.'
'Check bookmarks and printed links (posters, QR codes) that lead to these pages.': 'Skontrolujte záložky a tlačené odkazy (plagáty, QR kódy), ktoré vedú na tieto stránky.'
'Setup': 'Nastavenie'
'Fix': 'Oprava'
'Grow': 'Rast'
'Decide': 'Rozhodnutie'
'Last %days% days vs. the %days% days before': 'Posledných %days% dní oproti %days% dňom predtým'
'Last %days% days': 'Posledných %days% dní'
'and %count% more': 'a ďalších %count%'
'Details': 'Podrobnosti'
'Insights': 'Postrehy'
'Hide': 'Skryť'
'Show': 'Zobraziť'
'Show all (%count%)': 'Zobraziť všetko (%count%)'
'Show fewer': 'Zobraziť menej'
'No statistics yet. Insights need %days% complete days of them and then appear here on their own.': 'Zatiaľ žiadne štatistiky. Postrehy potrebujú %days% celých dní štatistík a potom sa tu objavia samy.'
'Insights need %days% complete days of statistics (so far: %count%). The first ones can appear on %day%.': 'Postrehy potrebujú %days% celých dní štatistík (zatiaľ: %count%). Prvé sa môžu objaviť %day%.'
'Too few visits to tell a real problem from chance (last %days% days: %count%). Insights appear as the site gets more visits.': 'Príliš málo návštev na to, aby sa dal skutočný problém odlíšiť od náhody (posledných %days% dní: %count%). Postrehy sa objavia, keď bude mať web viac návštev.'
'Nothing needs attention so far. Checks that compare longer periods start once there are %days% days of statistics, on %day%.': 'Zatiaľ netreba nič riešiť. Kontroly, ktoré porovnávajú dlhšie obdobia, začnú, keď bude %days% dní štatistík: %day%.'
'Nothing needs attention. Broken links, site search, languages, visits and browsers of the last %days% days look fine.': 'Netreba nič riešiť. Nefunkčné odkazy, vyhľadávanie na webe, jazyky, návštevy aj prehliadače za posledných %days% dní sú v poriadku.'

# Deleting statistics (administrators and developers)
'Manage statistics': 'Správa štatistík'
'Delete statistics': 'Odstrániť štatistiky'
'Delete the statistics of the last days, or all of them. Deleted statistics cannot be recovered.': 'Odstráni štatistiky posledných dní alebo všetky. Odstránené štatistiky nie je možné obnoviť.'
'Delete statistics…': 'Odstrániť štatistiky…'
'Close': 'Zavrieť'
'Which statistics should be deleted? The period always ends now; older statistics stay as they are.': 'Ktoré štatistiky chcete odstrániť? Obdobie vždy končí teraz; staršie štatistiky zostanú bez zmeny.'
'Period to delete': 'Obdobie na odstránenie'
'Today': 'Dnes'
'Last 90 days': 'Posledných 90 dní'
'Number of days': 'Počet dní'
'Everything': 'Všetko'
'All statistics ever collected': 'Všetky doteraz zozbierané štatistiky'
'From %date%': 'Od %date%'
'Cancel': 'Zrušiť'
'Continue': 'Pokračovať'
'Delete permanently?': 'Natrvalo odstrániť?'
'The statistics from %date% to now will be deleted:': 'Štatistiky od %date% do teraz budú odstránené:'
'All statistics will be deleted:': 'Všetky štatistiky budú odstránené:'
'All statistics, collected since %date%, will be deleted:': 'Všetky štatistiky, zbierané od %date%, budú odstránené:'
'And everything else of these days: pages, sources, devices, languages, site searches, broken links and bots.': 'A všetko ostatné z týchto dní: stránky, zdroje, zariadenia, jazyky, vyhľadávania na webe, nefunkčné odkazy a boty.'
'This cannot be undone. The statistics are erased for good; only a backup of the database can bring them back.': 'Túto akciu nie je možné vrátiť späť. Štatistiky budú odstránené navždy; obnoviť ich môže iba záloha databázy.'
'I understand that the deleted statistics cannot be recovered.': 'Rozumiem, že odstránené štatistiky nie je možné obnoviť.'
'Delete permanently': 'Natrvalo odstrániť'
'The statistics could not be counted.': 'Štatistiky sa nepodarilo spočítať.'
'The statistics could not be deleted.': 'Štatistiky sa nepodarilo odstrániť.'
'All statistics were deleted.': 'Všetky štatistiky boli odstránené.'
'The statistics of the chosen period were deleted.': 'Štatistiky zvoleného obdobia boli odstránené.'
'The statistics are being aggregated right now. Try again in a minute.': 'Štatistiky sa práve spracúvajú. Skúste to znova o minútu.'
