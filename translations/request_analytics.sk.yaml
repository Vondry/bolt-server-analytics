'A request is a bot when its User-Agent names one, or when its headers contradict the browser it claims to be. Bots are not counted in page views, visits or any other card. AI crawlers collect pages for AI models and answer engines; robots.txt can ask them to stay away.': 'Požiadavka je bot, keď sa ako bot predstaví v User-Agent, alebo keď si jej hlavičky odporujú s prehliadačom, za ktorý sa vydáva. Boti sa nepočítajú do zobrazení, návštev ani inej karty. AI crawlery zbierajú stránky pre AI modely a odpovedné vyhľadávače; v robots.txt ich možno požiadať, aby web vynechali.'
'Where visitors came from and went next': 'Odkiaľ návštevníci prišli a kam išli ďalej'
