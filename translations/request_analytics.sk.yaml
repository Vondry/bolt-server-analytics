'In this order: the UTM parameters of the link, the click ID an ad network adds (gclid, fbclid, …), the page the visitor came from.': 'V tomto poradí: UTM parametre odkazu, ID kliknutia, ktoré pridá reklamná sieť (gclid, fbclid, …), stránka, z ktorej návštevník prišiel.'
'Direct: a typed address, a bookmark, or an app that tells nothing. Unknown: no hint at all.': 'Priamo: zadaná adresa, záložka alebo aplikácia, ktorá nič neprezradí. Neznáme: žiadne vodítko.'
'Add UTM parameters to the links you publish: utm_campaign names the campaign, utm_source the place, utm_medium the kind of channel.': 'Pridajte UTM parametre k odkazom, ktoré zverejňujete: utm_campaign pomenuje kampaň, utm_source miesto, utm_medium druh kanála.'
'Newsletter': 'Newsletter'
'Social media post': 'Príspevok na sociálnych sieťach'
'Google Ads: auto-tagging adds gclid, counted as Paid search from google_ads. To see campaign names, add this as the final URL suffix:': 'Google Ads: automatické značkovanie pridá gclid, počíta sa ako platené vyhľadávanie zo zdroja google_ads. Pre názvy kampaní pridajte ako príponu konečnej URL:'
'Meta ads (Facebook, Instagram): fbclid is added automatically, counted as Social from meta. To see campaign names, add this to the URL parameters of the ad:': 'Reklamy Meta (Facebook, Instagram): fbclid sa pridá automaticky, počíta sa ako sociálne siete zo zdroja meta. Pre názvy kampaní pridajte do parametrov URL reklamy:'
'Sklik (Seznam): auto-tagging adds utm_source=seznam and utm_medium=cpc, counted as Paid search from seznam. Without auto-tagging, sznclid is counted the same way.': 'Sklik (Seznam): automatické značkovanie pridá utm_source=seznam a utm_medium=cpc, počíta sa ako platené vyhľadávanie zo zdroja seznam. Bez automatického značkovania sa rovnako počíta sznclid.'
'utm_medium decides the channel: cpc, ppc or paid → Paid search, from a social network → Social; social → Social; email or newsletter → Email; display, banner or cpm → Display; affiliate → Affiliate; organic → Organic search; referral → Referral; anything else → Campaign. Without utm_medium, utm_source decides: an AI assistant, a social network, a search engine or a newsletter, otherwise Campaign.': 'Kanál určuje utm_medium: cpc, ppc alebo paid → platené vyhľadávanie, zo sociálnej siete → sociálne siete; social → sociálne siete; email alebo newsletter → e-mail; display, banner alebo cpm → bannery; affiliate → affiliate; organic → vyhľadávače; referral → odkazy z webov; čokoľvek iné → kampaň. Bez utm_medium rozhoduje utm_source: AI asistent, sociálna sieť, vyhľadávač alebo newsletter, inak kampaň.'
'Another domain that leads here (a former or a short one): list it in aliases.hosts of %file%, with this site as aliases.target. The extension answers that domain, counts the visit and redirects.': 'Iná doména, ktorá vedie sem (bývalá alebo skrátená): uveďte ju v aliases.hosts v súbore %file% a tento web ako aliases.target. Rozšírenie potom na tej doméne odpovedá, započíta návštevu a presmeruje.'
'A QR code, a poster or any printed link: link to the address below and add its marker (here poster-a2) to aliases.hosts.': 'QR kód, plagát alebo akýkoľvek tlačený odkaz: odkážte na adresu nižšie a pridajte jej značku (tu poster-a2) do aliases.hosts.'
'If the redirect happens elsewhere (at the registrar or in the web server), let it add ?ra_via=<domain> to the address and set aliases.mode to tag.': 'Ak presmerovanie prebieha inde (u registrátora alebo vo webovom serveri), nech k adrese pridá ?ra_via=<domain>, a nastavte aliases.mode na tag.'
'Visits through an alias also count in their channel: the alias tells which address they used, the channel how they got to it.': 'Návštevy cez alias sa počítajú aj vo svojom kanáli: alias hovorí, akú adresu použili, kanál, ako sa k nej dostali.'

